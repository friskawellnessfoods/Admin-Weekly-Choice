<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friska — Kitchen Status</title>
<script src="config.js"></script>
<style>
  :root{
    --navy:#0a1a6e; --navy-deep:#08155a; --accent:#10b981; --accent-soft:#e7f7f1;
    --bg:#eef2f9; --ink:#16213e; --muted:#6b7596; --line:#e2e7f1;
    --radius:16px; --shadow:0 14px 40px rgba(20,33,62,0.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .hero{ background:linear-gradient(135deg,var(--navy),#13278f); padding:18px 16px 44px; position:relative; overflow:hidden; }
  .hero::after{ content:""; position:absolute; width:170px; height:170px; border-radius:50%;
    background:rgba(16,185,129,.22); filter:blur(50px); bottom:-70px; left:-40px; }
  .hero-in{ position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px;
    max-width:760px; margin:0 auto; }
  .hero-brand{ display:flex; align-items:center; gap:10px; }
  .hero-brand img{ width:40px; height:40px; object-fit:contain; background:#fff; border-radius:10px; padding:5px; }
  .hero h1{ margin:0; font-size:16px; font-weight:700; color:#fff; }
  .hero p{ margin:2px 0 0; font-size:11.5px; color:rgba(255,255,255,.72); }

  .wrap{ max-width:760px; margin:0 auto; padding:0 14px 40px; }
  .toolbar{ margin-top:-28px; position:relative; z-index:2; background:#fff; border-radius:var(--radius);
    padding:12px; box-shadow:var(--shadow); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .toolbar input[type=date]{ flex:1; min-width:150px; padding:11px 12px; border:1.5px solid var(--line);
    border-radius:11px; font-size:15px; font-family:inherit; background:#fbfcfe; color:var(--ink); }
  .toolbar input[type=date]:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(16,185,129,.12); }

  .btn{ border:none; border-radius:11px; padding:11px 16px; font-family:inherit; font-weight:700;
    font-size:14px; cursor:pointer; background:var(--navy); color:#fff; box-shadow:0 5px 14px rgba(10,26,110,.18); }
  .btn:active{ transform:scale(.98); background:var(--navy-deep); }
  .btn.ghost{ background:#fff; color:var(--navy); border:1.5px solid var(--line); box-shadow:none; }
  .btn:disabled{ opacity:.5; cursor:default; box-shadow:none; }

  .status-line{ font-size:12.5px; color:var(--muted); margin:12px 2px 0; min-height:18px; }

  .slot{ background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-top:14px;
    border:1px solid rgba(226,231,241,.7); }
  .slot-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding-bottom:10px; margin-bottom:12px; border-bottom:1.5px solid var(--line); }
  .slot-name{ font-size:17px; font-weight:700; color:var(--navy); }
  .slot-count{ font-size:12px; color:var(--muted); font-weight:500; }

  .sub{ font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:var(--muted); margin:2px 0 8px; }

  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .sbtn{ flex:1; min-width:120px; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:12px; padding:12px 8px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; transition:all .15s; }
  .sbtn .ic{ font-size:19px; }
  .sbtn:active{ transform:scale(.97); }
  .sbtn.on{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 5px 14px rgba(16,185,129,.28); }
  .sbtn.past{ background:var(--accent-soft); border-color:#bfe8db; color:#0b7a5a; }

  .route{ border:1px solid var(--line); border-radius:13px; padding:12px; margin-top:10px; background:#fbfcfe; }
  .route-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .route-name{ font-size:14.5px; font-weight:700; color:var(--navy); }
  .route-count{ font-size:11.5px; color:var(--muted); font-weight:500; }
  .chip{ font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    padding:3px 9px; border-radius:999px; background:#eef1f7; color:var(--muted); white-space:nowrap; }
  .chip.on{ background:var(--accent-soft); color:#0b7a5a; }

  .agent-row{ display:flex; gap:7px; margin-bottom:9px; flex-wrap:wrap; }
  .agent-row input{ flex:1; min-width:110px; padding:10px 11px; border:1.5px solid var(--line);
    border-radius:10px; font-size:14px; font-family:inherit; background:#fff; color:var(--ink); }
  .agent-row input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(16,185,129,.12); }
  .agent-row button{ flex:none; padding:10px 14px; font-size:13px; }
  .saved-note{ font-size:11px; color:#0b7a5a; font-weight:600; margin:-4px 0 8px; display:none; }

  .empty{ text-align:center; color:var(--muted); padding:40px 14px; font-size:14px;
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); margin-top:14px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy);
    color:#fff; padding:11px 20px; border-radius:11px; font-size:13.5px; font-weight:600;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:100; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; }

  @media (max-width:520px){
    .sbtn{ min-width:0; font-size:11.5px; padding:11px 4px; }
    .sbtn .ic{ font-size:17px; }
  }

  .daybar{ background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:14px;
    margin-top:14px; border:1px solid rgba(226,231,241,.7); }
  .daybar .sub{ margin-top:0; }
  .daybar .hint{ font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .slot.done{ opacity:.62; }
  .closed-tag{ font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    background:#eef1f7; color:var(--muted); padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .meal-name{ font-size:17px; font-weight:700; color:var(--navy); }
  .slot-sub{ font-size:11.5px; color:var(--muted); font-weight:500; }

  /* full-screen busy overlay so updates are visible wherever you scrolled to */
  #busy{ position:fixed; inset:0; background:rgba(238,242,249,.72); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:500; }
  #busy.on{ display:flex; }
  #busy .box{ background:#fff; border-radius:16px; padding:22px 26px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:12px; min-width:170px; }
  #busy .ring{ width:34px; height:34px; border:3.5px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .7s linear infinite; }
  #busy .txt{ font-size:13px; font-weight:600; color:var(--navy); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* collapsible delivery partners */
  .partners{ background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); margin-top:14px;
    border:1px solid rgba(226,231,241,.7); overflow:hidden; }
  .partners-head{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; cursor:pointer; user-select:none; }
  .partners-head .t{ font-size:14.5px; font-weight:700; color:var(--navy); }
  .partners-head .s{ font-size:11.5px; color:var(--muted); font-weight:500; margin-top:2px; }
  .partners-head .arrow{ color:var(--muted); font-size:13px; flex:none; }
  .partners-body{ padding:0 16px 14px; border-top:1px solid var(--line); }
  .partners-body.hide{ display:none; }
  .prow{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap; }
  .prow:last-child{ border-bottom:none; }
  .prow .rname{ flex:0 0 100%; font-size:12.5px; font-weight:700; color:var(--navy); }
  .prow input{ flex:1; min-width:100px; padding:9px 11px; border:1.5px solid var(--line);
    border-radius:10px; font-size:14px; font-family:inherit; background:#fbfcfe; color:var(--ink); }
  .prow input:focus{ outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(16,185,129,.12); }
  .prow button{ flex:none; padding:9px 14px; font-size:13px; }
  .agent-chip{ font-size:11px; color:var(--muted); font-weight:600; }
  .agent-chip b{ color:var(--navy); }

  /* cooking: red until pressed, green once on */
  .sbtn.danger{ background:#dc2626; border-color:#dc2626; color:#fff; box-shadow:0 5px 14px rgba(220,38,38,.26); }
  .sbtn.danger .ic{ filter:none; }

  /* collapsible slot */
  .slot-head{ cursor:pointer; user-select:none; }
  .slot-head .chev{ color:var(--muted); font-size:13px; flex:none; margin-left:8px; }
  .slot-body.hide{ display:none; }

  /* compact route chips that wrap inline */
  .chipwrap{ display:flex; flex-wrap:wrap; gap:7px; margin-top:2px; }
  .rchip{ flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:11px; padding:8px 11px; font-family:inherit; font-size:12.5px;
    font-weight:700; cursor:pointer; transition:all .13s; line-height:1.2; }
  .rchip:active{ transform:scale(.97); }
  .rchip .tick{ width:16px; height:16px; border-radius:5px; border:1.6px solid #c8d0e0;
    background:#fff; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; }
  .rchip .cnt{ font-weight:600; color:var(--muted); font-size:11px; }
  .rchip.sel{ border-color:var(--navy); background:#eef1fb; }
  .rchip.sel .tick{ background:var(--navy); border-color:var(--navy); }
  .rchip.done{ border-color:var(--accent); background:var(--accent-soft); color:#0b7a5a; }
  .rchip.done .tick{ background:var(--accent); border-color:var(--accent); }
  .rchip.done .cnt{ color:#0b7a5a; }
  .selbar{ display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .sellink{ font-size:11.5px; font-weight:700; color:var(--navy); cursor:pointer; }
  .sellink.mute{ color:var(--muted); }
  .selcount{ font-size:11.5px; color:var(--muted); font-weight:600; margin-left:auto; }
  .actrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .actrow .btn{ flex:1 1 auto; }
  .btn.go{ background:var(--accent); box-shadow:0 5px 14px rgba(16,185,129,.26); }
  .btn.go:disabled{ background:#c8d0e0; box-shadow:none; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-in">
    <div class="hero-brand">
      <img src="logo.png" alt="Friska">
      <div>
        <h1>Kitchen Status</h1>
        <p>Update what clients see</p>
      </div>
    </div>
    <button class="btn ghost" onclick="load()">Refresh</button>
  </div>
</div>

<div class="wrap">
  <div class="toolbar">
    <input type="date" id="date">
    <button class="btn" id="loadBtn" onclick="load()">Load Day</button>
  </div>
  <div class="status-line" id="statusLine">Pick a date and press Load Day.</div>
  <div id="board"></div>
</div>

<div id="busy"><div class="box"><div class="ring"></div><div class="txt" id="busyTxt">Updating…</div></div></div>

<div class="toast" id="toast"></div>

<script>
/* Endpoint comes from config.js so a redeploy only needs editing there. */
function cfgVal(name, fallback){
  try {
    const v = eval("typeof " + name + " !== 'undefined' ? " + name + " : undefined");
    return (v === undefined || v === null || v === "") ? fallback : v;
  } catch(e){ return fallback; }
}
const API = cfgVal("API_URL", "");

/* Cooking is day-wide, Packaging is per slot, Dispatched is per route.
   There is no Delivered step - nobody confirms delivery. */
const META = {
  'Cooking':    { icon:'\u{1F373}', label:'Cooking Started' },
  'Packaging':  { icon:'\u{1F4E6}', label:'Packaging' },
  'Dispatched': { icon:'\u{1F6F5}', label:'Dispatched' }
};

let BOARD = null;
let busy = false;
let partnersOpen = false;
let slotOpen = {};        // slot -> bool
let picked  = {};         // "slot||route" -> true

const dateEl = document.getElementById('date');
const boardEl = document.getElementById('board');
const lineEl = document.getElementById('statusLine');

dateEl.valueAsDate = new Date();
dateEl.addEventListener('click', () => { try{ dateEl.showPicker(); }catch(e){} });

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function attr(s){ return String(s==null?'':s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1900);
}
function setLine(msg){ lineEl.textContent = msg; }

/* centred overlay so it is visible no matter where the page is scrolled */
function showBusy(on, text){
  const b = document.getElementById('busy');
  const t = document.getElementById('busyTxt');
  if(t && text) t.textContent = text;
  if(b) b.classList.toggle('on', !!on);
}

async function api(action, params){
  if(!API) throw new Error('config.js did not load or has no API_URL');
  const body = new URLSearchParams(Object.assign({ action }, params || {}));
  const res = await fetch(API, { method:'POST', body });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e){ throw new Error('Server did not return JSON (HTTP ' + res.status + ')'); }
}

async function load(){
  if(!dateEl.value){ setLine('Pick a date first.'); return; }
  boardEl.innerHTML = '';
  showBusy(true, 'Loading the day\u2026');
  setLine('Loading ' + dateEl.value + '\u2026');
  try {
    const r = await api('getKitchenBoard', { date: dateEl.value });
    if(!r || !r.ok) throw new Error((r && r.message) || 'Could not load the day');
    BOARD = r;
    picked = {};
    (r.slots||[]).forEach(s => { if(slotOpen[s.slot] === undefined) slotOpen[s.slot] = !s.expired; });
    render();
    const total = (r.slots||[]).reduce((s,x)=>s+x.clients,0);
    setLine(total + ' client(s) across ' + (r.slots||[]).length + ' slot(s) on ' + r.date + '.');
  } catch(err){
    boardEl.innerHTML = '<div class="empty">Could not load.<br><span style="font-size:12px;opacity:.75;">'
      + esc(err.message||err) + '</span></div>';
    setLine('Error.');
  } finally {
    showBusy(false);
  }
}

/* every distinct route across all slots, so numbers live in one place */
function allRoutes(){
  const seen = {}, out = [];
  (BOARD.slots||[]).forEach(s => (s.routes||[]).forEach(r => {
    const k = r.route.toLowerCase();
    if(!seen[k]){ seen[k] = true; out.push({ route:r.route, name:r.agentName, phone:r.agentPhone }); }
  }));
  return out.sort((a,b)=>{
    if(a.route === 'No Route') return 1;
    if(b.route === 'No Route') return -1;
    return a.route.localeCompare(b.route, undefined, { numeric:true });
  });
}
function routeId(route){ return btoa(unescape(encodeURIComponent(route))).replace(/=/g,''); }
function pickKey(slot, route){ return slot + '||' + route; }
function pickedIn(slot){
  return Object.keys(picked).filter(k => picked[k] && k.indexOf(slot + '||') === 0)
               .map(k => k.slice(slot.length + 2));
}

function render(){
  if(!BOARD || !BOARD.slots || !BOARD.slots.length){
    boardEl.innerHTML = '<div class="empty">No orders for this date.</div>';
    return;
  }

  /* ---- delivery partners, collapsed by default ---- */
  const routes = allRoutes();
  const filled = routes.filter(r => r.phone).length;

  const partners =
    '<div class="partners">'
      + '<div class="partners-head" onclick="togglePartners()">'
        + '<div><div class="t">Delivery partners</div>'
        + '<div class="s">' + filled + ' of ' + routes.length + ' route(s) have a number saved</div></div>'
        + '<div class="arrow">' + (partnersOpen ? '\u25B4' : '\u25BE') + '</div>'
      + '</div>'
      + '<div class="partners-body' + (partnersOpen ? '' : ' hide') + '">'
        + routes.map(r => {
            const id = routeId(r.route);
            return '<div class="prow">'
              + '<div class="rname">' + esc(r.route)
                + (r.name || r.phone
                    ? ' <span class="agent-chip">\u00b7 <b>' + esc(r.name || '\u2014') + '</b> ' + esc(r.phone || '') + '</span>'
                    : ' <span class="agent-chip">\u00b7 not set</span>')
              + '</div>'
              + '<input type="text" id="an_' + id + '" placeholder="Name" value="' + attr(r.name) + '">'
              + '<input type="tel" id="ap_' + id + '" inputmode="numeric" placeholder="Phone" value="' + attr(r.phone) + '">'
              + '<button class="btn ghost" onclick="saveAgent(\'' + attr(r.route) + '\')">Save</button>'
            + '</div>';
          }).join('')
      + '</div>'
    + '</div>';

  /* ---- day-wide cooking: red until pressed, green once on ---- */
  const cookCls = 'sbtn ' + (BOARD.dayCooking ? 'on' : 'danger');
  const cookTime = BOARD.dayUpdated ? String(BOARD.dayUpdated).slice(11,16) : '';
  const dayBar =
    '<div class="daybar">'
      + '<div class="sub">Whole day \u00b7 all slots</div>'
      + '<div class="btn-row">'
        + '<button class="'+cookCls+'" onclick="setStatus(\'__DAY__\',\'__ALL__\',\'Cooking\','+(BOARD.dayCooking?'true':'false')+')">'
          + '<span class="ic">' + META.Cooking.icon + '</span>'
          + (BOARD.dayCooking ? 'Cooking Started' : 'Cooking Not Started')
          + (cookTime && BOARD.dayCooking ? '<span style="font-size:10px;opacity:.85;">' + esc(cookTime) + '</span>' : '')
        + '</button>'
      + '</div>'
      + '<div class="hint">Every client \u2014 morning, afternoon and evening \u2014 sees "Cooking" '
        + 'as soon as this is on. Press again to undo.</div>'
    + '</div>';

  const slotsHtml = BOARD.slots.map(s => {

    const closed = !!s.expired;
    const open = !!slotOpen[s.slot];

    const packCls = 'sbtn' + (s.packaging ? ' on' : '');
    const packBtn =
      '<button class="'+packCls+'" onclick="setStatus(\'' + attr(s.slot) + '\',\'__ALL__\',\'Packaging\','+(s.packaging?'true':'false')+')">'
        + '<span class="ic">' + META.Packaging.icon + '</span>' + esc(s.meal) + ' Packaging'
      + '</button>';

    const doneCount = s.routes.filter(r => r.dispatched).length;

    /* compact chips, wrap inline, tick to select */
    const chips = s.routes.map(r => {
      const key = pickKey(s.slot, r.route);
      const sel = !!picked[key];
      const cls = 'rchip' + (r.dispatched ? ' done' : '') + (sel ? ' sel' : '');
      const tick = (sel || r.dispatched) ? '\u2713' : '';
      const t = r.updated ? String(r.updated).slice(11,16) : '';
      return '<button class="'+cls+'" onclick="togglePick(\'' + attr(s.slot) + '\',\'' + attr(r.route) + '\')">'
        + '<span class="tick">' + tick + '</span>'
        + '<span>' + esc(r.route) + '</span>'
        + '<span class="cnt">' + r.clients + (r.dispatched && t ? ' \u00b7 ' + esc(t) : '') + '</span>'
      + '</button>';
    }).join('');

    const nPicked = pickedIn(s.slot).length;

    const body =
      '<div class="btn-row">' + packBtn + '</div>'
      + '<div class="sub" style="margin-top:16px;">Dispatch by route '
        + '<span style="color:var(--accent);">\u00b7 ' + doneCount + ' of ' + s.routes.length + ' dispatched</span></div>'
      + '<div class="chipwrap">' + chips + '</div>'
      + '<div class="selbar">'
        + '<span class="sellink" onclick="pickAll(\'' + attr(s.slot) + '\',true)">Select all</span>'
        + '<span class="sellink mute" onclick="pickAll(\'' + attr(s.slot) + '\',false)">Clear</span>'
        + '<span class="selcount">' + nPicked + ' selected</span>'
      + '</div>'
      + '<div class="actrow">'
        + '<button class="btn go" ' + (nPicked ? '' : 'disabled') + ' onclick="dispatchPicked(\'' + attr(s.slot) + '\',false)">'
          + META.Dispatched.icon + '  Dispatch selected</button>'
        + '<button class="btn ghost" ' + (nPicked ? '' : 'disabled') + ' onclick="dispatchPicked(\'' + attr(s.slot) + '\',true)">Undo selected</button>'
      + '</div>';

    return '<div class="slot' + (closed ? ' done' : '') + '">'
      + '<div class="slot-head" onclick="toggleSlot(\'' + attr(s.slot) + '\')">'
        + '<div><div class="meal-name">' + esc(s.meal) + '</div>'
        + '<div class="slot-sub">' + esc(s.slot) + ' slot \u00b7 ' + s.clients + ' client(s) \u00b7 '
          + doneCount + '/' + s.routes.length + ' dispatched</div></div>'
        + (closed ? '<span class="closed-tag">Closed \u00b7 resets ' + s.resetHour + ':00</span>' : '')
        + '<span class="chev">' + (open ? '\u25B4' : '\u25BE') + '</span>'
      + '</div>'
      + '<div class="slot-body' + (open ? '' : ' hide') + '">' + body + '</div>'
    + '</div>';
  }).join('');

  boardEl.innerHTML = partners + dayBar + slotsHtml;
}

function togglePartners(){ partnersOpen = !partnersOpen; render(); }
function toggleSlot(slot){ slotOpen[slot] = !slotOpen[slot]; render(); }

function togglePick(slot, route){
  const k = pickKey(slot, route);
  if(picked[k]) delete picked[k]; else picked[k] = true;
  render();
}
function pickAll(slot, on){
  const s = (BOARD.slots||[]).find(x => x.slot === slot);
  if(!s) return;
  s.routes.forEach(r => {
    const k = pickKey(slot, r.route);
    if(on) picked[k] = true; else delete picked[k];
  });
  render();
}

/* one call for however many routes are ticked */
async function dispatchPicked(slot, undo){
  if(busy) return;
  const list = pickedIn(slot);
  if(!list.length){ toast('Tick at least one route'); return; }

  busy = true;
  showBusy(true, undo ? 'Undoing\u2026' : ('Dispatching ' + list.length + ' route(s)\u2026'));
  setLine('Updating\u2026');
  try {
    const r = await api('setKitchenStatus', {
      date: dateEl.value,
      slot: slot,
      route: list.join('||'),
      status: undo ? '' : 'Dispatched'
    });
    if(!r || !r.ok) throw new Error((r && r.message) || 'Update failed');
    if(r.board){ BOARD = r.board; }
    list.forEach(rt => delete picked[pickKey(slot, rt)]);
    render();
    toast((undo ? 'Cleared ' : 'Dispatched ') + list.length + ' route(s) in ' + slot);
    setLine((undo ? 'Cleared ' : 'Dispatched ') + list.join(', ') + ' in ' + slot + '.');
  } catch(err){
    toast('Failed: ' + (err.message || err));
    setLine('Update failed.');
  } finally {
    busy = false;
    showBusy(false);
  }
}

/* pressing an active button again clears that level */
async function setStatus(slot, route, status, isOn){
  if(busy) return;
  busy = true;
  const send = isOn ? '' : status;
  showBusy(true, send ? ('Setting ' + send + '\u2026') : 'Clearing\u2026');
  setLine('Updating\u2026');
  try {
    const r = await api('setKitchenStatus', { date: dateEl.value, slot, route, status: send });
    if(!r || !r.ok) throw new Error((r && r.message) || 'Update failed');
    if(r.board) { BOARD = r.board; render(); }
    const what = (slot === '__DAY__') ? 'Cooking (whole day)'
               : (route === '__ALL__' || route === 'ALL') ? (slot + ' \u00b7 all routes')
               : (slot + ' \u00b7 ' + route);
    toast(send ? (what + ' \u2192 ' + send) : (what + ' cleared'));
    setLine(send ? ('Set ' + what + ' to ' + send + '.') : ('Cleared ' + what + '.'));
  } catch(err){
    toast('Failed: ' + (err.message || err));
    setLine('Update failed.');
  } finally {
    busy = false;
    showBusy(false);
  }
}

async function saveAgent(route){
  if(busy) return;
  busy = true;
  const id = routeId(route);
  const name = (document.getElementById('an_' + id) || {}).value || '';
  const phone = (document.getElementById('ap_' + id) || {}).value || '';
  showBusy(true, 'Saving\u2026');
  try {
    const r = await api('saveDeliveryAgent', { route, name, agentPhone: phone });
    if(!r || !r.ok) throw new Error((r && r.message) || 'Save failed');
    (BOARD.slots||[]).forEach(s => (s.routes||[]).forEach(x => {
      if(x.route === route){ x.agentName = r.name; x.agentPhone = r.phone; }
    }));
    partnersOpen = true;
    render();
    toast('Saved for ' + route);
  } catch(err){
    toast('Save failed: ' + (err.message || err));
  } finally {
    busy = false;
    showBusy(false);
  }
}

load();
