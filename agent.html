<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friska — My Deliveries</title>
<link rel="manifest" href="agent-manifest.json">
<meta name="theme-color" content="#15306b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Friska Deliveries">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --ink:#15306b; --ink-2:#56699a; --ink-3:#8b9cc2;
    --paper:#ebf0fa; --surface:#fff; --rule:#cfdaf0; --rule-2:#e4ebf8; --tint:#f6f9ff;
    --go:#0d9488; --go-bg:#dcf3f0; --warn:#a4620a; --warn-bg:#fdf1dd;
    --bad:#c2282c; --wa:#1faa52;
    --deep:linear-gradient(145deg,#15306b 0%,#1d3f8f 58%,#1b4fa8 100%);
    --tap:50px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums;
    overscroll-behavior-y:contain; }
  input,button,select{ font:inherit; color:inherit; }

  /* An id beats a class, so the hidden state has to be stated per screen —
     otherwise #sGate's own display wins and the sign-in sits under everything. */
  .screen{ display:none; }
  body[data-at="gate"]  #sGate{ display:flex; }
  body[data-at="slots"] #sSlots,
  body[data-at="route"] #sRoute{ display:block; }

  /* sign in */
  #sGate{ min-height:100dvh; flex-direction:column; align-items:center;
    justify-content:center; gap:20px; padding:30px 22px; }
  #sGate img{ height:58px; }
  #sGate h1{ margin:0; font-size:25px; font-weight:700; letter-spacing:-.02em; }
  #sGate p{ margin:0; color:var(--ink-2); font-size:14.5px; text-align:center; max-width:280px; }
  #sGate .f{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }

  input[type=tel], input[type=date]{ width:100%; min-height:var(--tap); padding:13px 15px;
    font-size:17px; background:var(--surface); color:var(--ink);
    border:1px solid var(--rule); border-radius:12px; }
  input:focus{ outline:none; border-color:var(--go); box-shadow:0 0 0 3px rgba(13,148,136,.16); }

  .btn{ min-height:var(--tap); width:100%; padding:14px 18px; border:0; border-radius:12px;
    font-size:16.5px; font-weight:600; cursor:pointer; background:var(--ink); color:#fff; }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn.go{ background:var(--go); }
  .btn.line{ background:var(--surface); color:var(--ink); border:1px solid var(--rule); }
  .btn.wa{ background:var(--wa); }
  .btn.sm{ min-height:42px; width:auto; padding:9px 15px; font-size:14.5px; border-radius:10px; }
  .btn:disabled{ opacity:.4; }

  /* header */
  .top{ position:sticky; top:0; z-index:20; background:var(--deep); color:#fff;
    padding:calc(11px + env(safe-area-inset-top)) 15px 12px; }
  .top .r1{ display:flex; align-items:center; gap:10px; }
  .top .me{ font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .top .sub{ font-size:12.5px; color:#a9bfe6; margin-top:1px; }
  .top .grow{ flex:1; }
  .tbtn{ min-height:40px; padding:0 13px; border:0; border-radius:10px;
    background:rgba(255,255,255,.12); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .top .r2{ margin-top:11px; display:flex; gap:9px; align-items:center; }
  .top input[type=date]{ min-height:40px; padding:8px 12px; font-size:14.5px;
    background:rgba(255,255,255,.12); border:0; color:#fff; }
  .top input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(1); opacity:.8; }

  .wrap{ max-width:620px; margin:0 auto; padding:15px 15px calc(30px + env(safe-area-inset-bottom)); }

  /* slot cards */
  .slotcard{ background:var(--surface); border:1px solid var(--rule); border-radius:14px;
    padding:17px; margin-bottom:12px; cursor:pointer; width:100%; text-align:left; }
  .slotcard:active{ background:var(--tint); }
  .slotcard .m{ font-size:19px; font-weight:700; letter-spacing:-.015em; }
  .slotcard .d{ font-size:13.5px; color:var(--ink-2); margin-top:4px; }
  .slotcard .tag{ display:inline-block; margin-top:9px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:7px; background:var(--rule-2); color:var(--ink-2); }
  .slotcard .tag.out{ background:var(--go-bg); color:var(--go); }
  .slotcard .tag.done{ background:var(--go); color:#fff; }

  /* the run */
  .runhead{ background:var(--surface); border:1px solid var(--rule); border-radius:14px;
    padding:16px 17px; margin-bottom:14px; }
  .runhead .m{ font-size:19px; font-weight:700; letter-spacing:-.015em; }
  .runhead .d{ font-size:13.5px; color:var(--ink-2); margin-top:3px; }
  .meter{ height:8px; border-radius:99px; background:var(--rule-2); margin-top:13px; overflow:hidden; }
  .meter i{ display:block; height:100%; background:var(--go); transition:width .3s; }

  .pickbar{ background:var(--warn-bg); border:1px solid #e8c88a; border-radius:14px;
    padding:16px 17px; margin-bottom:14px; }
  .pickbar .t{ font-weight:700; font-size:16px; color:var(--warn); }
  .pickbar .s{ font-size:13.5px; color:var(--warn); margin:5px 0 13px; line-height:1.45; }

  /* stops */
  .stop{ background:var(--surface); border:1px solid var(--rule); border-radius:13px;
    padding:13px 14px; margin-bottom:10px; display:flex; gap:12px; }
  .stop.done{ background:var(--tint); border-color:var(--go); }

  /* The run reads as a stack you work down: the stop in your hand is the loud
     one, what is behind you fades, what is ahead waits its turn. */
  .stop.now{ border-color:var(--ink); border-width:2px; padding:16px 16px;
    box-shadow:0 6px 18px rgba(12,28,64,.13); }
  .stop.now .nm{ font-size:19px; }
  .stop.now .lo{ font-size:15px; margin-top:4px; }
  .stop.now .n{ width:34px; height:34px; font-size:15px; }
  .stop.later{ opacity:.58; padding:11px 13px; }
  .stop.later .nm{ font-size:15px; }
  /* behind him: one quiet line, still undoable */
  .stop.done{ opacity:.52; padding:8px 11px; align-items:center; gap:10px; }
  .stop.done .nm{ font-size:14.5px; font-weight:500; }
  .stop.done .n{ width:24px; height:24px; border-radius:7px; font-size:12px; }
  .stop.done .mid{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .stop.done .row{ margin-top:0; flex:none; }
  .stop.done .row .btn{ flex:none; font-size:12px; padding:4px 10px; min-width:0; }
  .stop .lo, .stop .row{ transition:opacity .16s ease; }
  .n{ flex:none; width:30px; height:30px; border-radius:9px; background:var(--ink); color:#fff;
    font-size:13.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .stop.done .n{ background:var(--go); }
  .mid{ flex:1; min-width:0; }
  .nm{ font-weight:600; font-size:16px; }
  .lo{ font-size:13.5px; color:var(--ink-2); margin-top:2px; word-break:break-word; }
  a.lo{ color:var(--ink); text-decoration:underline; text-underline-offset:2px; display:inline-block; }
  .at{ font-size:12.5px; color:var(--go); font-weight:600; margin-top:4px; }
  /* how far this stop is from the one before it */
  .leg{ font-weight:500; color:var(--ink-2); font-size:.86em; }
  .row{ display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }
  .row .btn{ flex:1; min-width:84px; }

  .note{ background:var(--surface); border:1px solid var(--rule); border-radius:13px;
    padding:14px 15px; font-size:14px; color:var(--ink-2); margin-bottom:12px; }
  .empty{ text-align:center; color:var(--ink-2); padding:48px 18px; font-size:15px;
    background:var(--surface); border:1px solid var(--rule); border-radius:14px; }
  .say{ font-size:13px; color:var(--ink-2); min-height:18px; margin-bottom:11px; }

  .veil{ position:fixed; inset:0; z-index:90; display:none; align-items:center;
    justify-content:center; padding:24px; background:rgba(21,48,107,.55); backdrop-filter:blur(3px); }
  .veil.on{ display:flex; }
  .veil .box{ background:var(--surface); border-radius:16px; padding:26px 28px;
    min-width:210px; max-width:300px; text-align:center; box-shadow:0 18px 50px rgba(12,28,64,.3); }
  .veil .ring{ width:38px; height:38px; margin:0 auto 15px; border:3px solid var(--rule);
    border-top-color:var(--go); border-radius:50%; animation:sp .8s linear infinite; }
  .veil .w{ font-size:15.5px; font-weight:600; }
  .veil .k{ font-size:12.5px; color:var(--ink-2); margin-top:7px; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

  .toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%); background:var(--ink); color:#fff; padding:13px 20px;
    border-radius:12px; font-size:14.5px; font-weight:500; opacity:0; transition:opacity .25s;
    pointer-events:none; z-index:95; max-width:88%; text-align:center; }
  .toast.show{ opacity:1; }
</style>
</head>
<body data-at="gate">

<!-- 1 · sign in, once -->
<div class="screen" id="sGate">
  <img src="logo.png" alt="Friska">
  <h1>My Deliveries</h1>
  <p>Enter the phone number your routes are saved under. You only need to do this once.</p>
  <div class="f">
    <input type="tel" id="phone" inputmode="numeric" placeholder="Phone number" autocomplete="tel">
    <button class="btn go" id="signin">Show my deliveries</button>
    <div class="say" id="gateSay" style="text-align:center"></div>
  </div>
</div>

<!-- 2 · which slot -->
<div class="screen" id="sSlots">
  <div class="top">
    <div class="r1">
      <div><div class="me" id="me2">—</div><div class="sub" id="sub2"></div></div>
      <span class="grow"></span>
      <button class="tbtn" onclick="signOut()">Sign out</button>
    </div>
    <div class="r2">
      <input type="date" id="date2" max="">
      <button class="tbtn" onclick="load()">Refresh</button>
    </div>
  </div>
  <div class="wrap"><div class="say" id="say2"></div><div id="slotList"></div></div>
</div>

<!-- 3 · the run -->
<div class="screen" id="sRoute">
  <div class="top">
    <div class="r1">
      <button class="tbtn" id="backBtn" onclick="toSlots()">&lsaquo;</button>
      <div><div class="me" id="me3">—</div><div class="sub" id="sub3"></div></div>
      <span class="grow"></span>
      <button class="tbtn" onclick="signOut()">Sign out</button>
    </div>
    <div class="r2">
      <input type="date" id="date3" max="">
      <button class="tbtn" onclick="load()">Refresh</button>
    </div>
  </div>
  <div class="wrap"><div class="say" id="say3"></div><div id="runBody"></div></div>
</div>

<div class="veil" id="veil"><div class="box">
  <div class="ring"></div><div class="w" id="veilW">Working…</div>
  <div class="k">Keep this page open</div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API = (typeof API_URL !== 'undefined' && API_URL) ? API_URL : '';
const $ = id => document.getElementById(id) || {};

let DAY = null, me = '', slot = null;

/* A rider reopens this app a dozen times on one run. Remembering which slot
   they are on means a reload drops them back into the run, not onto a menu.
   Scoped to the date so tomorrow starts clean. */
const slotKey = d => 'friska_agent_slot_' + d;
function rememberSlot(d, s){ try { s ? localStorage.setItem(slotKey(d), s)
                                     : localStorage.removeItem(slotKey(d)); } catch(e){} }
function recallSlot(d){ try { return localStorage.getItem(slotKey(d)) || null; } catch(e){ return null; } }

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                   .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const plural = (n,w) => w + (n===1?'':'s');

function todayStr(){ const n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }

function prettyDay(ymd){
  const p=String(ymd).split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
  if (isNaN(d)) return ymd;
  const t=new Date(); t.setHours(0,0,0,0);
  const diff=Math.round((d-t)/86400000);
  const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return diff===0 ? 'Today' : diff===-1 ? 'Yesterday' : (d.getDate()+' '+mon);
}

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2300); }
function say(m){ ['say2','say3','gateSay'].forEach(id=>{ if($(id).textContent!==undefined) $(id).textContent=m; }); }

function busy(on, what){
  if (on && what) $('veilW').textContent = what;
  $('veil').classList.toggle('on', !!on);
}
window.addEventListener('error',              ()=>busy(false));
window.addEventListener('unhandledrejection', ()=>busy(false));

async function api(action, params={}){
  if (!API) throw new Error('config.js did not load');
  const res = await fetch(API, { method:'POST', body:new URLSearchParams({ action, ...params }) });
  return res.json();
}

/* Tapping anywhere on the date box opens the calendar, not just the icon. */
document.querySelectorAll('input[type=date]').forEach(el=>{
  el.addEventListener('click', ()=>{ try { el.showPicker(); } catch(e){} });
});

/* ---------- signing in, once ---------- */
try { me = localStorage.getItem('friska_agent_phone') || ''; } catch(e){}

$('signin').addEventListener('click', ()=>{
  const p = ($('phone').value||'').replace(/\D/g,'');
  if (p.length < 10){ $('gateSay').textContent = 'Enter all ten digits.'; return; }
  me = p.slice(-10);
  try { localStorage.setItem('friska_agent_phone', me); } catch(e){}
  load();
});
$('phone').addEventListener('keydown', e=>{ if (e.key==='Enter') $('signin').click(); });

function signOut(){
  if (!confirm('Sign out of this device?')) return;
  try { localStorage.removeItem('friska_agent_phone'); } catch(e){}
  try { Object.keys(localStorage).filter(k=>k.indexOf('friska_agent_slot_')===0)
          .forEach(k=>localStorage.removeItem(k)); } catch(e){}
  me=''; DAY=null; slot=null;
  document.body.dataset.at='gate';
  $('phone').value=''; $('gateSay').textContent='';
}

/* The date box sits on both screens — a rider who steps back a day on a
   single-slot run never sees the slot list, so without it there is no way
   back to today. Two inputs, one value. Back only: tomorrow is not settled. */
const DATE_BOXES = ['date2','date3'];
const theDate = () => $('date2').value || todayStr();
function setDate(v){ DATE_BOXES.forEach(id=>{ if ($(id).value !== undefined) $(id).value = v; }); }

DATE_BOXES.forEach(id=>{
  const el = $(id);
  el.max = todayStr();
  el.value = todayStr();
  el.addEventListener('change', ()=>{ setDate(el.value); load(); });
});

/* ---------- loading the day ---------- */
/* The run barely changes once the kitchen has saved it, so the last copy is
   painted straight away and the fresh one replaces it when it lands. On a
   patchy mobile signal that is the difference between a usable list and a
   spinner, and his own Delivered marks are already on the stored copy. */
const dayKey = d => 'friska_agent_day_' + me + '_' + d;

function storeDay(d, r){
  try { localStorage.setItem(dayKey(d), JSON.stringify(r)); } catch(e){}
}
function recallDay(d){
  try { const v = localStorage.getItem(dayKey(d)); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}

async function load(){
  if (!me){ document.body.dataset.at='gate'; return; }
  const date = theDate();

  const cached = recallDay(date);
  const warm = !!(cached && cached.ok && cached.found && (cached.slots||[]).length);
  if (warm){
    paintDay(cached, date);          // on screen now, no network waited on
    say('Checking for changes…');
  } else {
    busy(true, 'Loading your deliveries…');
    say('Loading…');
  }

  try {
    const r = await api('getAgentDay', { phone: me, date });
    if (!r || !r.ok) throw new Error((r && r.message) || 'Could not load');

    if (!r.found){
      DAY = null;
      document.body.dataset.at = 'gate';
      $('gateSay').textContent = r.message ||
        'That number is not set against any route. Ask the kitchen to add you.';
      return;
    }

    storeDay(date, r);
    paintDay(r, date);
    say('');
  } catch(e){
    /* A warm list already on screen is worth more than an error in place of
       it — he can keep delivering and the marks will go up when the signal
       comes back. */
    if (warm) say('Showing your saved list — could not reach the kitchen.');
    else {
      say('Could not load: ' + e.message);
      $('gateSay').textContent = 'Could not load: ' + e.message;
    }
  } finally { busy(false); }
}

/* Delivered marks made on this phone this session. A refresh that lands a
   moment before the write does must not un-tick a stop under his thumb. */
const localDone = {};
const doneKey = s => s.slot + '||' + s.phone;

function paintDay(r, date){
  DAY = r;
  (DAY.stops||[]).forEach(s=>{
    const k = doneKey(s);
    if (localDone[k] && !s.delivered){ s.delivered = true; s.at = localDone[k]; }
    if (localDone[k] === false && s.delivered){ s.delivered = false; s.at = ''; }
  });
  // the server's own counts can disagree with that, so recount from the stops
  (DAY.slots||[]).forEach(sl=>{
    sl.delivered = (DAY.stops||[]).filter(s=>s.slot===sl.slot && s.delivered).length;
  });

  $('me2').textContent = $('me3').textContent = r.name || 'My deliveries';
  const totals = (r.slots||[]).reduce((a,s)=>a+s.parcels,0);
  $('sub2').textContent = prettyDay(date) + ' · ' + totals + plural(totals,' parcel');
  setDate(date);

  if (!r.slots || !r.slots.length){
    document.body.dataset.at = 'slots';
    $('slotList').innerHTML =
      '<div class="empty">Nothing assigned to you for ' + esc(prettyDay(date).toLowerCase()) +
      '.<br><span style="font-size:13.5px">If routes have not been saved yet, check again shortly.</span></div>';
    return;
  }

  // one slot means there is nothing to choose — go straight to the run
  const want = slot || recallSlot(date);
  if (r.slots.length === 1){ slot = r.slots[0].slot; showRun(); }
  else if (want && r.slots.some(s=>s.slot===want)){ slot = want; showRun(); }
  else showSlots();
}

/* ---------- which slot ---------- */
function showSlots(){
  slot = null;
  rememberSlot(DAY && DAY.date, null);
  document.body.dataset.at = 'slots';
  $('slotList').innerHTML = (DAY.slots||[]).map(s=>{
    const allDone = s.parcels && s.delivered >= s.parcels;
    return '<button class="slotcard" onclick="pickSlot(\''+esc(s.slot)+'\')">'+
      '<div class="m">'+esc(s.meal||s.slot)+'</div>'+
      '<div class="d">'+s.route+' · '+s.parcels+plural(s.parcels,' parcel')+
        (s.pickedUp ? ' · '+s.delivered+' delivered' : '')+'</div>'+
      '<span class="tag'+(allDone?' done':(s.pickedUp?' out':''))+'">'+
        (allDone ? 'All delivered' : s.pickedUp ? 'Picked up' : 'Not picked up yet')+
      '</span></button>';
  }).join('');
}
function pickSlot(s){ slot = s; rememberSlot(DAY.date, s); showRun(); }
function toSlots(){ if ((DAY.slots||[]).length > 1) showSlots(); }

/* ---------- the run ---------- */
function slotInfo(){ return (DAY.slots||[]).find(s=>s.slot===slot) || null; }

function showRun(){
  document.body.dataset.at = 'route';
  const info = slotInfo();
  if (!info){ showSlots(); return; }

  const stops = (DAY.stops||[]).filter(s=>s.slot===slot);
  const done  = stops.filter(s=>s.delivered).length;
  const multi = (DAY.slots||[]).length > 1;

  $('backBtn').style.visibility = multi ? '' : 'hidden';
  $('me3').textContent = (info.meal||info.slot) + ' · ' + info.route;
  $('sub3').textContent = prettyDay(theDate()) + ' · ' + DAY.name;

  /* Before pickup the banner below already gives the count, so a second card
     saying the same thing is just a card to scroll past. */
  const head = info.pickedUp
    ? '<div class="runhead">'+
        '<div class="m">'+stops.length+plural(stops.length,' parcel')+'</div>'+
        '<div class="d">'+done+' of '+stops.length+' delivered</div>'+
        '<div class="meter"><i style="width:'+(stops.length?done/stops.length*100:0)+'%"></i></div>'+
      '</div>'
    : '';

  /* Before pickup the list is for checking against what is in your hands, so
     nothing is tappable — a half-tapped Delivered on parcels still in the
     kitchen is worse than no list at all. */
  /* The first one not yet delivered is the one he is driving to. */
  const nowAt = stops.findIndex(s=>!s.delivered);
  const body = info.pickedUp
    ? stops.map((s,k)=>liveStop(s, s.delivered ? 'done' : (k===nowAt ? 'now' : 'later'))).join('')
    : stops.map(quietStop).join('');

  const pick = info.pickedUp
    ? '<div class="note">Picked up'+(info.pickedUpAt ? ' at '+esc(String(info.pickedUpAt).slice(11,16)) : '')+
      '. Clients on this run can see it is on the way.'+
      (done===0 ? ' <a href="#" onclick="undoPick(event)">Undo</a>' : '')+'</div>'
    : '<div class="pickbar">'+
        '<div class="t">'+stops.length+plural(stops.length,' parcel')+' to collect</div>'+
        '<div class="s">Check them against the list below. Pressing Picked up tells every '+
          'client on this run that their meal is on the way.</div>'+
        '<button class="btn go" onclick="pickUp()">Picked up — start delivering</button>'+
      '</div>';

  $('runBody').innerHTML = head + pick + body;
}

function quietStop(s){
  const leg = (s.legKm || s.legKm === 0) && isFinite(s.legKm)
    ? ' <span class="leg">(' + s.legKm + ' km)</span>' : '';
  return '<div class="stop">'+
    '<div class="n">'+s.stop+'</div>'+
    '<div class="mid"><div class="nm">'+esc(s.name)+leg+'</div>'+
      '<div class="lo">'+esc(s.location||'')+'</div></div>'+
  '</div>';
}

function liveStop(s, state){
  const i = DAY.stops.indexOf(s);
  const link = s.link ? String(s.link).replace(/,/g,'%2C')
    : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.name);
  const leg = (s.legKm || s.legKm === 0) && isFinite(s.legKm)
    ? ' <span class="leg">(' + s.legKm + ' km)</span>' : '';

  // done collapses to a line you can still undo; ahead keeps Maps and Call
  if (state === 'done'){
    return '<div class="stop done">'+
      '<div class="n">&#10003;</div>'+
      '<div class="mid">'+
        '<div class="nm">'+esc(s.name)+
          (s.at ? ' · <span class="at">'+esc(String(s.at).slice(11,16))+'</span>' : '')+'</div>'+
        '<div class="row"><button class="btn line sm" onclick="undoStop('+i+')">Undo</button></div>'+
      '</div>'+
    '</div>';
  }

  return '<div class="stop '+state+'"'+(state==='now'?' id="nowStop"':'')+'>'+
    '<div class="n">'+s.stop+'</div>'+
    '<div class="mid">'+
      '<div class="nm">'+esc(s.name)+leg+'</div>'+
      '<a class="lo" href="'+esc(link)+'" target="_blank" rel="noopener">'+
        esc(s.location||'Open in Maps')+'</a>'+
      '<div class="row">'+
        '<a class="btn line sm" href="tel:'+esc(s.phone)+'">Call</a>'+
        '<button class="btn wa sm" onclick="deliver('+i+')">Delivered</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

/* ---------- picking up ---------- */
async function pickUp(){
  const info = slotInfo();
  if (!info) return;
  busy(true, 'Marking picked up…');
  try {
    const r = await api('markPickedUp', {
      date: DAY.date, slot: info.slot, route: info.route, undo:'false'
    });
    if (r && r.ok){
      info.pickedUp = true;
      showRun();
      toast('Clients on this run now see it is on the way');
    } else toast('Could not mark it: ' + ((r&&r.message)||'try again'));
  } catch(e){ toast('Could not mark it: ' + e.message); }
  finally { busy(false); }
}

async function undoPick(ev){
  if (ev) ev.preventDefault();
  const info = slotInfo();
  if (!info || !confirm('Undo picked up for this run?')) return;
  busy(true, 'Undoing…');
  try {
    const r = await api('markPickedUp', {
      date: DAY.date, slot: info.slot, route: info.route, undo:'true'
    });
    if (r && r.ok){ info.pickedUp = false; showRun(); }
    else toast('Could not undo');
  } catch(e){ toast('Could not undo: ' + e.message); }
  finally { busy(false); }
}

/* ---------- delivering ---------- */
/* A rider is at a door with the parcel in his hand. Waiting on a round trip
   to Sheets, behind a blocking overlay, is the slowest part of his day, so
   the screen moves the moment he presses and the write follows behind. If the
   write fails the stop comes back exactly as it was, with a toast telling him
   to press again — nothing is quietly lost. */
function nowHM(){
  const n = new Date(), p = v => String(v).padStart(2,'0');
  return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+
         ' '+p(n.getHours())+':'+p(n.getMinutes());
}

/* Keep the stop he is driving to under his thumb after the list reflows. */
function focusNow(){
  const el = $('nowStop');
  if (el && el.scrollIntoView) {
    try { el.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(e){ el.scrollIntoView(); }
  }
}

function deliver(i){
  const s = DAY.stops[i];
  if (!s || s.delivered || s.busy) return;
  const info = slotInfo();

  s.delivered = true; s.at = nowHM(); s.busy = true;
  localDone[doneKey(s)] = s.at;
  if (info) info.delivered = (info.delivered||0) + 1;
  showRun(); focusNow();                      // instant, before the network
  storeDay(DAY.date, DAY);

  const undo = () => {
    s.delivered = false; s.at = ''; s.busy = false;
    delete localDone[doneKey(s)];
    if (info) info.delivered = Math.max(0, (info.delivered||1) - 1);
    showRun(); storeDay(DAY.date, DAY);
    toast('Could not save ' + s.name + ' — press Delivered again');
  };

  api('markDelivered', {
    date: DAY.date, slot: s.slot, route: s.route, phone: s.phone, by: DAY.name || me
  }).then(r => {
    s.busy = false;
    if (r && r.ok){ if (r.at) { s.at = r.at; showRun(); } }
    else undo();
  }).catch(undo);
}

function undoStop(i){
  const s = DAY.stops[i];
  if (!s || !s.delivered || s.busy) return;
  if (!confirm('Mark ' + s.name + ' as not delivered?')) return;
  const info = slotInfo();
  const was = s.at;

  s.delivered = false; s.at = ''; s.busy = true;
  localDone[doneKey(s)] = false;
  if (info) info.delivered = Math.max(0, (info.delivered||1) - 1);
  showRun(); focusNow(); storeDay(DAY.date, DAY);

  const back = () => {
    s.delivered = true; s.at = was; s.busy = false;
    localDone[doneKey(s)] = was;
    if (info) info.delivered = (info.delivered||0) + 1;
    showRun(); storeDay(DAY.date, DAY);
    toast('Could not undo ' + s.name + ' — try again');
  };

  api('undoDelivered', { date: DAY.date, slot: s.slot, phone: s.phone })
    .then(r => { s.busy = false; if (!r || !r.ok) back(); })
    .catch(back);
}

/* ---------- start ---------- */
if (me){ $('phone').value = me; load(); }

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('agent-sw.js').catch(()=>{}));
}
</script>
</body>
