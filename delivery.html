<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friska — Delivery Routes</title>
<script src="config.js"></script>
<style>
  :root{
    --c-bg:#eef2f6; --c-surface:#ffffff; --c-ink:#1f2a37; --c-muted:#5b6b7b; --c-line:#d7e0ea;
    --grad-a:#0ea5a3; --grad-b:#2563eb; --c-primary:#0ea5a3; --c-primary-d:#0b8482;
    --wa:#25D366; --radius:12px; --shadow:0 6px 24px rgba(20,40,70,.10);
  }
  *{ box-sizing:border-box; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; margin:0; background:var(--c-bg); color:var(--c-ink); -webkit-text-size-adjust:100%; }

  .bar{ background:var(--c-surface); }
  body.landing .bar{
    position:static; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:32px 20px;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(37,99,235,.10), transparent 60%),
      radial-gradient(900px 500px at 50% 110%, rgba(14,165,163,.12), transparent 60%),
      var(--c-bg);
  }
  body.landing .content{ display:none; }
  body.working .bar{
    position:sticky; top:0; z-index:10; flex-direction:row; min-height:auto; padding:10px 16px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-start;
    background:var(--c-surface); border-bottom:1px solid var(--c-line); box-shadow:0 1px 0 rgba(0,0,0,.02);
  }

  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ height:36px; width:auto; }
  .brand span{ font-size:16px; font-weight:800; letter-spacing:.2px;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  body.landing .brand{ flex-direction:column; gap:10px; margin-bottom:4px; }
  body.landing .brand img{ height:64px; }
  body.landing .brand span{ font-size:26px; }

  .hero-sub{ display:none; }
  body.landing .hero-sub{ display:block; color:var(--c-muted); font-size:14px; margin-top:-6px; text-align:center; }

  .controls{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  body.landing .controls{ flex-direction:column; width:100%; max-width:340px; }
  body.landing .controls > *{ width:100%; }
  .field{ position:relative; display:flex; align-items:center; }
  body.landing .field{ width:100%; }
  .field input[type=date]{ padding:12px 14px; border:1.5px solid var(--c-line); border-radius:var(--radius); font-size:15px;
    cursor:pointer; background:var(--c-surface); color:var(--c-ink); width:100%; transition:border-color .15s, box-shadow .15s; }
  .field input[type=date]:focus{ outline:none; border-color:var(--c-primary); box-shadow:0 0 0 3px rgba(14,165,163,.16); }

  .btn{ padding:12px 18px; border:0; border-radius:var(--radius); font-size:15px; font-weight:700; cursor:pointer; color:#fff;
    transition:transform .08s, filter .15s, box-shadow .15s; background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); box-shadow:0 4px 14px rgba(37,99,235,.25); }
  .btn:hover:not(:disabled){ filter:brightness(1.05); }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn.alt{ background:var(--c-surface); color:var(--c-primary-d); border:1.5px solid var(--c-line); box-shadow:none; }
  .btn.alt:hover:not(:disabled){ border-color:var(--c-primary); }
  .btn:disabled{ opacity:.45; cursor:default; box-shadow:none; }
  body.landing .btn{ padding:14px 18px; font-size:16px; }

  .status{ font-size:13px; color:var(--c-muted); display:inline-flex; align-items:center; gap:8px; }
  body.working .status{ margin-left:auto; }
  body.landing .status{ margin-top:4px; }
  .spinner{ width:15px; height:15px; border:2.5px solid var(--c-line); border-top-color:var(--c-primary); border-radius:50%; animation:spin .7s linear infinite; display:none; }
  .status.busy .spinner{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .content{ max-width:640px; margin:0 auto; padding:14px 14px 60px; }
  .section-title{ font-size:16px; font-weight:800; margin:14px 0 10px; color:var(--c-ink); }
  .back-link{ display:inline-block; margin-bottom:10px; color:var(--c-primary-d); font-weight:700; cursor:pointer; font-size:14px; }
  .empty-state{ text-align:center; color:var(--c-muted); padding:40px 12px; font-size:14px; }
  .loading{ text-align:center; padding:36px; color:var(--c-muted); }

  .tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .tile{ background:var(--c-surface); border:2px solid var(--c-line); border-radius:var(--radius); padding:16px; text-align:center;
    cursor:pointer; transition:border-color .15s, transform .1s, box-shadow .15s; box-shadow:var(--shadow); }
  .tile:active{ transform:scale(.97); }
  .tile:hover{ border-color:#b9c6d6; }
  .tile.active{ border-color:var(--c-primary); background:#e9fbfa; }
  .tile .route-name{ font-weight:800; font-size:15px; margin-bottom:4px; }
  .tile .route-count{ font-size:13px; color:var(--c-muted); }
  .tile.new-route{ border-style:dashed; color:var(--c-primary-d); font-weight:800; display:flex; align-items:center; justify-content:center; }

  .search-wrap{ position:relative; margin-bottom:14px; }
  .search-wrap input{ width:100%; padding:12px 14px; border:1.5px solid var(--c-line); border-radius:var(--radius); font-size:15px; background:var(--c-surface); color:var(--c-ink); }
  .search-wrap input:focus{ outline:none; border-color:var(--c-primary); box-shadow:0 0 0 3px rgba(14,165,163,.16); }
  .search-drop{ position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--c-surface); border:1px solid var(--c-line);
    border-radius:var(--radius); box-shadow:var(--shadow); max-height:300px; overflow-y:auto; z-index:20; display:none; }
  .search-drop.show{ display:block; }
  .search-item{ padding:11px 14px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; align-items:center; border-bottom:1px solid var(--c-line); }
  .search-item:last-child{ border-bottom:none; }
  .search-item:hover{ background:var(--c-bg); }
  .search-item .nm{ font-weight:600; color:var(--c-ink); }
  .search-item .rt{ font-size:12px; font-weight:700; color:#fff; background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); padding:3px 11px; border-radius:999px; white-space:nowrap; }
  .search-item .rt.none{ background:#94a3b8; }
  .search-empty{ padding:12px 14px; color:var(--c-muted); font-size:14px; }

  .filter-row{ display:flex; gap:8px; margin-bottom:10px; }
  .filter-row input{ flex:1; min-width:0; padding:12px 14px; border:1.5px solid var(--c-line); border-radius:var(--radius); font-size:15px; background:var(--c-surface); color:var(--c-ink); }
  .filter-row input:focus{ outline:none; border-color:var(--c-primary); box-shadow:0 0 0 3px rgba(14,165,163,.16); }
  .filter-row .btn{ flex:1; }

  .client-card{ background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--radius); padding:12px; margin-bottom:8px;
    display:flex; align-items:center; gap:12px; box-shadow:0 2px 8px rgba(20,40,70,.05); }
  .client-card.off{ opacity:.5; }
  .client-info{ flex:1; min-width:0; }
  .client-info .name{ font-weight:600; font-size:15px; }
  .client-info .meta{ font-size:13px; color:var(--c-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .client-info .dist{ font-size:12px; color:var(--c-primary-d); margin-top:2px; font-weight:600; }
  .route-check{ width:20px; height:20px; flex-shrink:0; accent-color:var(--c-primary); }
  .stop-dropdown{ position:relative; width:60px; flex:none; }
  .stop-dropdown-btn{ width:100%; padding:8px 4px; border-radius:8px; border:1px solid var(--c-line); font-size:15px; text-align:center; background:#fff; cursor:pointer; color:var(--c-ink); }
  .stop-dropdown-menu{ position:absolute; top:calc(100% + 4px); right:0; background:var(--c-surface); border:1px solid var(--c-line); border-radius:8px;
    max-height:180px; overflow-y:auto; z-index:50; min-width:60px; box-shadow:var(--shadow); }
  .stop-dropdown-menu div{ padding:8px 12px; text-align:center; font-size:15px; cursor:pointer; }
  .stop-dropdown-menu div:hover{ background:var(--c-bg); }

  .full{ width:100%; }
  .secondary{ background:var(--c-surface); color:var(--c-primary-d); border:1.5px solid var(--c-line); box-shadow:none; }
  .secondary:hover:not(:disabled){ border-color:var(--c-primary); }
  .distance-btn{ background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); }

  .add-panel{ background:#f0f7f7; border:1px dashed var(--c-primary); border-radius:var(--radius); padding:10px; margin-bottom:12px; }
  .add-row{ display:flex; align-items:center; gap:10px; padding:8px; border-bottom:1px solid var(--c-line); }
  .add-row:last-child{ border-bottom:none; }
  .add-row .info{ flex:1; min-width:0; }
  .add-row .info .name{ font-weight:600; font-size:14px; }
  .add-row .info .meta{ font-size:12px; color:var(--c-muted); }
  .add-row button{ padding:6px 12px; font-size:13px; background:var(--c-primary); }

  .message-box{ background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--radius); padding:12px; margin-top:12px;
    white-space:pre-wrap; font-size:14px; line-height:1.5; font-family:ui-monospace,Menlo,Consolas,monospace; box-shadow:var(--shadow); }
  .action-row{ display:flex; gap:8px; margin-top:10px; }
  .action-row button{ flex:1; }
  .action-row .wa-btn{ background:var(--wa); }
  .action-row .wa-btn:active{ background:#1da851; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--c-primary-d); color:#fff; padding:10px 20px;
    border-radius:8px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:100; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; }

  @media screen and (max-width:640px){
    body.working .bar{ padding:8px 10px; gap:8px; }
    .brand span{ font-size:14px; } .brand img{ height:30px; }
    .field{ flex:1 1 auto; }
    .status{ width:100%; margin:2px 0 0; } body.working .status{ margin-left:0; }
  }

  .saveroute{ background:#f0f7f7; border:1px solid var(--c-primary); border-radius:var(--radius);
    padding:10px; margin-bottom:12px; }
  .saveroute .sr-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .saveroute input{ flex:1 1 160px; min-width:0; padding:11px 12px; border:1.5px solid var(--c-line);
    border-radius:var(--radius); font-size:15px; background:var(--c-surface); color:var(--c-ink); }
  .saveroute input:focus{ outline:none; border-color:var(--c-primary); box-shadow:0 0 0 3px rgba(14,165,163,.16); }
  .saveroute .btn{ flex:0 0 auto; }
  .saveroute .sr-note{ font-size:12px; color:var(--c-muted); margin-top:8px; line-height:1.5; }
  .assigned-tag{ font-size:11px; font-weight:700; color:#fff; background:var(--c-primary);
    padding:2px 8px; border-radius:999px; margin-left:6px; white-space:nowrap; }

  .copybox{ background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:14px; box-shadow:var(--shadow); }
  .copybox .cb-head{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer; user-select:none; }
  .copybox .cb-t{ font-size:14px; font-weight:800; color:var(--c-ink); }
  .copybox .cb-s{ font-size:12px; color:var(--c-muted); margin-top:2px; }
  .copybox .cb-arrow{ color:var(--c-muted); font-size:13px; flex:none; }
  .copybox .cb-body{ margin-top:10px; border-top:1px solid var(--c-line); padding-top:10px; }
  .copybox .cb-body.hide{ display:none; }
  .cb-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--c-line); }
  .cb-row:last-of-type{ border-bottom:none; }
  .cb-row input{ width:19px; height:19px; accent-color:var(--c-primary); flex:none; }
  .cb-row .cb-n{ font-weight:700; font-size:14px; }
  .cb-row .cb-m{ font-size:12px; color:var(--c-muted); margin-left:auto; white-space:nowrap; }

  .saveroute .sr-done{ font-size:12px; font-weight:700; color:var(--c-primary-d);
    margin-top:8px; line-height:1.5; }

  .client-card.on{ border-color:var(--c-primary); background:#f2fbfb;
    box-shadow:0 2px 10px rgba(14,165,163,.14); }
  .client-card.on .name{ color:var(--c-primary-d); }
  .list-head{ display:flex; align-items:center; gap:8px; margin:12px 2px 6px; }
  .list-head:first-child{ margin-top:0; }
  .list-head .lh-t{ font-size:11.5px; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; color:var(--c-muted); white-space:nowrap; }
  .list-head .lh-line{ flex:1; height:1px; background:var(--c-line); }
  .list-head.sel .lh-t{ color:var(--c-primary-d); }

  .pen{ flex:none; background:none; border:none; cursor:pointer; font-size:15px;
    color:var(--c-muted); padding:4px 6px; border-radius:8px; line-height:1; }
  .pen:hover{ background:var(--c-bg); color:var(--c-primary-d); }
  .loc-tag{ font-size:11px; font-weight:700; color:#fff; background:#7c3aed;
    padding:2px 8px; border-radius:999px; margin-left:6px; white-space:nowrap; }
  .lm-back{ position:fixed; inset:0; background:rgba(20,40,70,.45); z-index:300;
    display:none; align-items:center; justify-content:center; padding:16px; }
  .lm-back.on{ display:flex; }
  .lm{ background:var(--c-surface); border-radius:var(--radius); width:100%; max-width:440px;
    box-shadow:0 24px 60px rgba(20,40,70,.3); padding:18px; }
  .lm h3{ margin:0 0 4px; font-size:17px; }
  .lm .lm-sub{ font-size:12.5px; color:var(--c-muted); margin-bottom:14px; line-height:1.5; }
  .lm label{ display:block; font-size:12px; font-weight:700; color:var(--c-muted); margin:0 0 6px; }
  .lm input{ width:100%; padding:12px 13px; border:1.5px solid var(--c-line); border-radius:var(--radius);
    font-size:15px; background:var(--c-surface); color:var(--c-ink); }
  .lm input:focus{ outline:none; border-color:var(--c-primary); box-shadow:0 0 0 3px rgba(14,165,163,.16); }
  .lm .lm-cur{ font-size:12.5px; color:var(--c-muted); margin-top:10px; line-height:1.5; }
  .lm .lm-row{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .lm .lm-row .btn{ flex:1 1 auto; }
  .pac-container{ z-index:400 !important; }

  /* ===== SLOT OVERVIEW ===== */
  .ov-back{ position:fixed; inset:0; background:rgba(20,40,70,.45); z-index:350;
    display:none; align-items:flex-start; justify-content:center; padding:14px; overflow:auto; }
  .ov-back.on{ display:flex; }
  .ov{ background:#fff; border-radius:var(--radius); width:100%; max-width:900px;
    box-shadow:0 24px 60px rgba(20,40,70,.3); padding:18px; }
  .ov-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .ov-top h3{ margin:0; font-size:18px; }
  .ov-top .ov-meta{ font-size:12.5px; color:var(--c-muted); margin-top:3px; }
  .ov-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .ov-actions .btn{ padding:9px 14px; font-size:14px; }
  .ovt{ width:100%; border-collapse:collapse; font-size:13px; }
  .ovt th{ background:#f2f6fa; text-align:left; font-size:11px; text-transform:uppercase;
    letter-spacing:.04em; color:var(--c-muted); padding:7px 8px; border:1px solid var(--c-line); }
  .ovt td{ padding:6px 8px; border:1px solid var(--c-line); vertical-align:middle; }
  .ovt td.n{ width:34px; text-align:center; color:var(--c-muted); }
  .ovt tr.rt-first td{ border-top:2px solid #333; }
  .ovt .nm{ font-weight:600; white-space:nowrap; }
  .ovt .rt{ white-space:nowrap; font-weight:700; }

  @media print {
    body * { visibility: hidden !important; }
    .ov-back, .ov-back * { visibility: visible !important; }
    .ov-back{ position:absolute !important; inset:0 !important; display:block !important;
      background:#fff !important; padding:0 !important; overflow:visible !important; }
    .ov{ box-shadow:none !important; max-width:none !important; padding:0 !important; border-radius:0 !important; }
    .ov-actions{ display:none !important; }
    .ovt thead{ display:table-header-group; }
    .ovt tr{ page-break-inside:avoid; }
  }
</style>
</head>
<body class="landing">

  <div class="bar">
    <div class="brand">
      <img src="logo.png" alt="Friska Wellness Foods">
      <span>Delivery Routes</span>
    </div>
    <div class="hero-sub">Pick a date to plan the day's delivery routes.</div>
    <div class="controls">
      <div class="field"><input type="date" id="date"></div>
      <button id="go" class="btn">Generate</button>
      <span class="status" id="status"><span class="spinner"></span><span id="statusText">Pick a date to begin.</span></span>
    </div>
  </div>

  <div id="content" class="content"></div>

  <div class="toast" id="toast"></div>

  <div class="ov-back" id="ovModal">
    <div class="ov">
      <div class="ov-top">
        <div>
          <h3 id="ovTitle">Overview</h3>
          <div class="ov-meta" id="ovMeta"></div>
        </div>
        <div class="ov-actions">
          <button class="btn" onclick="window.print()">Download / Print</button>
          <button class="btn alt" onclick="closeOverview()">Close</button>
        </div>
      </div>
      <div id="ovBody"></div>
    </div>
  </div>

  <div class="lm-back" id="locModal">
    <div class="lm">
      <h3 id="lmName">Change location</h3>
      <div class="lm-sub" id="lmSub"></div>
      <label>New location for this day</label>
      <input type="text" id="lmInput" placeholder="Start typing an address…" autocomplete="off">
      <div class="lm-cur" id="lmCur"></div>
      <div class="lm-row">
        <button class="btn alt" onclick="closeLocModal()">Cancel</button>
        <button class="btn alt" id="lmResetBtn" onclick="resetLocOverride()">Use default</button>
        <button class="btn" onclick="saveLocOverride()">Save for this day</button>
      </div>
    </div>
  </div>

<script>
const API = (typeof API_URL !== 'undefined') ? API_URL : '';

let allClients = [];
let slotGroups = {};
let currentSlot = null;
let currentView = null;
let stopAssignments = {};
let currentClients = [];
let checkedClients = {};

const KITCHEN = { lat: 17.452623115758335, lng: 78.41967516576499 };
let geoMap = null;
let lastDistance = {};
let routeTotalMeters = null;
let lastMatrixError = null;
let hasGenerated = false;

const content    = document.getElementById('content');
const dateEl     = document.getElementById('date');
const goBtn      = document.getElementById('go');
const statusEl   = document.getElementById('status');
const statusText = document.getElementById('statusText');

dateEl.valueAsDate = new Date();

function setStatus(msg, busy){ statusText.textContent = msg; statusEl.classList.toggle('busy', !!busy); }
function showToast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

dateEl.addEventListener('click', () => { try{ dateEl.showPicker(); }catch(e){} });
dateEl.addEventListener('change', () => setStatus(dateEl.value ? 'Press Generate to load the day.' : 'Pick a date to begin.', false));

goBtn.addEventListener('click', () => {
  if(!dateEl.value){ setStatus('Pick a date first.', false); return; }
  if(!hasGenerated){ hasGenerated = true; document.body.classList.remove('landing'); document.body.classList.add('working'); }
  loadOrders();
});

async function apiPost(action, params = {}) {
  const body = new URLSearchParams({ action, ...params });
  const res = await fetch(API, { method: 'POST', body, redirect: 'follow' });
  return res.json();
}

async function loadOrders() {
  const date = dateEl.value;
  content.innerHTML = '<div class="loading">Loading active clients…</div>';
  setStatus('Loading ' + date + '…', true);
  try {
    const ordersRes = await apiPost('getOrdersForDate', { date });
    if (!ordersRes.success || !ordersRes.clients.length) {
      content.innerHTML = '<div class="empty-state">No active clients found for this date.</div>';
      allClients = []; slotGroups = {};
      setStatus('No clients for ' + date + '.', false);
      return;
    }
    allClients = []; slotGroups = {};
    ordersRes.clients.forEach(c => {
      const slot = String(c.slot || 'Unspecified').trim() || 'Unspecified';
      const route = String(c.route || '').trim() || 'No Route';
      const clientObj = { phone:c.phone, name:c.name, location:c.location, slot, route, location1:c.location1 || '', location2:c.location2 || '', route1:c.route1 || '', route2:c.route2 || '',
        baseLocation:c.location, ovLoc:c.overrideLocation || '', ovLat:(c.overrideLat==null?null:c.overrideLat), ovLng:(c.overrideLng==null?null:c.overrideLng), ovLink:c.overrideLink || '' };
      if (clientObj.ovLoc) clientObj.location = clientObj.ovLoc;
      allClients.push(clientObj);
      if (!slotGroups[slot]) slotGroups[slot] = {};
      if (!slotGroups[slot][route]) slotGroups[slot][route] = [];
      slotGroups[slot][route].push(clientObj);
    });
    Object.values(slotGroups).forEach(routes => Object.values(routes).forEach(arr => arr.sort((a, b) => a.name.localeCompare(b.name))));
    currentSlot = null; currentView = null; stopAssignments = {};
    await loadRouteAssignments();
    await loadPrevRoutes();
    setStatus(allClients.length + ' clients loaded for ' + date + '.', false);
    renderSummary();
  } catch (err) {
    content.innerHTML = '<div class="empty-state">Error loading data. Please try again.</div>';
    setStatus('Error loading data.', false);
    console.error(err);
  }
}

const SLOT_ORDER = ['Morning', 'Afternoon', 'Evening'];
function sortedSlots() {
  return Object.keys(slotGroups).sort((a, b) => {
    const ai = SLOT_ORDER.indexOf(a), bi = SLOT_ORDER.indexOf(b);
    if (ai === -1 && bi === -1) return a.localeCompare(b);
    if (ai === -1) return 1; if (bi === -1) return -1; return ai - bi;
  });
}

function renderSummary() {
  currentSlot = null; currentView = null; stopAssignments = {};
  const slots = sortedSlots();
  let html = '<div id="copyPanel"></div>';
  html += '<div class="section-title">Select Slot</div><div class="tiles">';
  slots.forEach(slot => {
    const totalCount = Object.values(slotGroups[slot]).reduce((s, arr) => s + arr.length, 0);
    html += `<div class="tile" onclick="openSlot('${escapeAttr(slot)}')"><div class="route-name">${escapeHtml(slot)}</div><div class="route-count">${totalCount} client(s)</div></div>`;
  });
  html += '</div>';
  content.innerHTML = html;
  renderCopyPanel();
}

function openSlot(slot) {
  currentSlot = slot; currentView = null; stopAssignments = {};
  // standing routes from the Master list first (in number order), then any
  // route created for today, then anything unrouted
  const adhocNames = new Set(Object.values(routeAssign));
  const routes = Object.keys(slotGroups[slot]).sort((a, b) => {
    if (a === 'No Route') return 1; if (b === 'No Route') return -1;
    const aa = adhocNames.has(a) ? 1 : 0, bb = adhocNames.has(b) ? 1 : 0;
    if (aa !== bb) return aa - bb;
    return a.localeCompare(b, undefined, { numeric: true });
  });
  let html = `<span class="back-link" onclick="renderSummary()">← Back to slots</span>`;
  html += `<div class="section-title">${escapeHtml(slot)}</div>`;
  html += `<div class="search-wrap">
    <input type="text" id="routeSearch" placeholder="Search a client in ${escapeHtml(slot)}…" oninput="searchClients()" autocomplete="off">
    <div class="search-drop" id="searchDrop"></div>
  </div>`;
  html += `<div class="tiles">`;
  routes.forEach(route => {
    html += `<div class="tile" onclick="openRoute('${escapeAttr(slot)}','${escapeAttr(route)}')"><div class="route-name">${escapeHtml(route)}</div><div class="route-count">${slotGroups[slot][route].length} client(s)</div></div>`;
  });
  html += `<div class="tile new-route" onclick="openNewRoute('${escapeAttr(slot)}')">➕ New Route</div>`;
  html += `</div>`;
  html += `<button class="btn full" onclick="openOverview('${escapeAttr(slot)}')">📋 Overview — full ${escapeHtml(slot)} list</button>`;
  content.innerHTML = html;
}

function searchClients() {
  const inp = document.getElementById('routeSearch');
  const drop = document.getElementById('searchDrop');
  if (!inp || !drop) return;
  const q = inp.value.trim().toLowerCase();
  if (!q) { drop.classList.remove('show'); drop.innerHTML = ''; return; }

  const flat = [];
  Object.keys(slotGroups[currentSlot]).forEach(route => {
    slotGroups[currentSlot][route].forEach(c => flat.push({ name: c.name, route }));
  });
  const matches = flat.filter(c => (c.name || '').toLowerCase().includes(q)).slice(0, 40);

  if (!matches.length) { drop.innerHTML = `<div class="search-empty">No client found in ${escapeHtml(currentSlot)}</div>`; drop.classList.add('show'); return; }

  drop.innerHTML = matches.map(c => {
    const none = c.route === 'No Route';
    return `<div class="search-item" onclick="openRoute('${escapeAttr(currentSlot)}','${escapeAttr(c.route)}')">
      <span class="nm">${escapeHtml(c.name)}</span>
      <span class="rt${none ? ' none' : ''}">${escapeHtml(c.route)}</span>
    </div>`;
  }).join('');
  drop.classList.add('show');
}
document.addEventListener('click', (e) => {

function openRoute(slot, route) {

function openNewRoute(slot) {

/* While building a new route, ticked clients move to the top so it is obvious
   who is already in. Numbered stops keep their order; everything else holds
   its original position. */
function sortForSelection(clients) {
  if (currentView !== 'NEW') return clients;

  const pos = {};
  clients.forEach((c, i) => { pos[c.phone] = i; });

  return clients.slice().sort((a, b) => {
    const at = checkedClients[a.phone] ? 0 : 1;
    const bt = checkedClients[b.phone] ? 0 : 1;
    if (at !== bt) return at - bt;

    const as = parseInt(stopAssignments[a.phone]);
    const bs = parseInt(stopAssignments[b.phone]);
    const aHas = !isNaN(as), bHas = !isNaN(bs);
    if (aHas && bHas && as !== bs) return as - bs;
    if (aHas && !bHas) return -1;
    if (!aHas && bHas) return 1;

    return pos[a.phone] - pos[b.phone];
  });
}

function renderClientList(clients, withStopSelect) {
  if (!clients.length) return '<div class="empty-state">No clients here.</div>';

  clients = sortForSelection(clients);

  const grouping = (currentView === 'NEW') && withStopSelect;
  const selCount = grouping ? clients.filter(c => checkedClients[c.phone]).length : 0;
  let headedSelected = false, headedRest = false;

  let html = '';
  clients.forEach(c => {

    if (grouping) {
      const isOn = !!checkedClients[c.phone];
      if (isOn && !headedSelected) {
        headedSelected = true;
        html += `<div class="list-head sel"><span class="lh-t">In this route · ${selCount}</span><span class="lh-line"></span></div>`;
      }
      if (!isOn && !headedRest) {
        headedRest = true;
        html += `<div class="list-head"><span class="lh-t">${selCount ? 'Everyone else' : 'Tap to add'}</span><span class="lh-line"></span></div>`;
      }
    }

    const on  = withStopSelect && checkedClients[c.phone] ? ' on' : '';
    const off = withStopSelect && !checkedClients[c.phone] ? ' off' : '';
    html += `<div class="client-card${on}${off}">`;
    if (withStopSelect) {
      const chk = checkedClients[c.phone] ? 'checked' : '';
      html += `<input type="checkbox" class="route-check" ${chk} onchange="toggleCheck('${escapeAttr(c.phone)}', this.checked)">`;
    }
    const distLine = (lastDistance[c.phone] != null && isFinite(lastDistance[c.phone]))
      ? `<div class="dist">${(lastDistance[c.phone] / 1000).toFixed(1)} km from previous stop</div>` : '';
    const _ar = assignedRoute(c);
    const _arTag = _ar ? `<span class="assigned-tag">${escapeHtml(_ar)}</span>` : '';
    const _ovTag = c.ovLoc ? `<span class="loc-tag">today only</span>` : '';
    html += `<div class="client-info"><div class="name">${escapeHtml(c.name)}${_arTag}${_ovTag}</div><div class="meta">${escapeHtml(c.phone)} · ${escapeHtml(c.location)}</div>${distLine}</div>`;
    html += `<button class="pen" title="Change location for this day" onclick="openLocModal('${escapeAttr(c.phone)}','${escapeAttr(c.slot)}')">✏️</button>`;
    if (withStopSelect) {
      const currentVal = stopAssignments[c.phone] || '-';
      html += `<div class="stop-dropdown" data-phone="${escapeAttr(c.phone)}"><div class="stop-dropdown-btn" onclick="toggleStopMenu(this, event)">${currentVal}</div></div>`;
    }
    html += `</div>`;
  });
  return html;
}

function toggleCheck(phone, val) {
  if (val) checkedClients[phone] = true;
  else { delete checkedClients[phone]; delete stopAssignments[phone]; }
  document.getElementById('clientListContainer').innerHTML = renderClientList(currentClients, true);
  refreshStopOptions();
  maybeRenderMessage();
  computeRouteTotal().then(() => maybeRenderMessage());
}

let routeAssign = {};        // 'Slot||phone' -> route name, for the loaded date

function renderCopyPanel() {

async function loadRouteAssignments() {
  try {
    const res = await apiPost('getRouteAssignments', { date: dateEl.value });
    routeAssign = {};
    if (res && res.ok && res.routes) {
      Object.keys(res.routes).forEach(r => {
        res.routes[r].forEach(x => { routeAssign[x.slot + '||' + x.phone] = r; });
      });
    }
  } catch (e) { routeAssign = {}; }
}

function assignedRoute(c) {
  return routeAssign[(c.slot || '') + '||' + String(c.phone || '')] || '';
}

/* the client's standing route from the Master list, used when a client is
   taken back off a day route */
function masterRouteOf(c) {
  if (c.location && c.location2 && c.location === c.location2) return c.route2 || c.route1 || '';
  return c.route1 || c.route2 || '';
}

/* rebuild slotGroups from allClients - no network call */
function rebuildSlotGroups() {
  slotGroups = {};
  allClients.forEach(c => {
    const slot  = c.slot || 'Unspecified';
    const route = String(c.route || '').trim() || 'No Route';
    if (!slotGroups[slot]) slotGroups[slot] = {};
    if (!slotGroups[slot][route]) slotGroups[slot][route] = [];
    slotGroups[slot][route].push(c);
  });
  Object.values(slotGroups).forEach(routes =>
    Object.values(routes).forEach(arr => arr.sort((a, b) => a.name.localeCompare(b.name))));
}

/* apply a saved route to the data already in memory, so the screen updates
   instantly and the whole day does not have to be fetched again */
function applyAssignmentLocally(slot, route, phones) {
  const picked = new Set(phones);

  // anyone previously on this route who is no longer ticked comes off it
  Object.keys(routeAssign).forEach(k => {
    if (routeAssign[k] !== route) return;
    if (k.indexOf(slot + '||') !== 0) return;
    const ph = k.slice(slot.length + 2);
    if (!picked.has(ph)) delete routeAssign[k];
  });

  phones.forEach(p => { routeAssign[slot + '||' + p] = route; });

  // recompute every client in this slot from the assignments + Master
  allClients.forEach(c => {
    if (c.slot !== slot) return;
    const ov = routeAssign[slot + '||' + c.phone];
    c.route = ov || masterRouteOf(c) || 'No Route';
  });

  rebuildSlotGroups();
}

/* the day routes already created, for the little progress line */
function todaysRouteSummary() {
  const counts = {};
  Object.keys(routeAssign).forEach(k => {
    const r = routeAssign[k];
    counts[r] = (counts[r] || 0) + 1;
  });
  const names = Object.keys(counts).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (!names.length) return '';
  return names.map(n => `${n} (${counts[n]})`).join(' · ');
}

async function saveRouteForDay() {
  const nameEl = document.getElementById('newRouteName');
  const name = (nameEl ? nameEl.value : '').trim();

  if (!name) { showToast('Give the route a name first'); if (nameEl) nameEl.focus(); return; }

  const picked = currentClients.filter(c => checkedClients[c.phone]);
  if (!picked.length) { showToast('Tick at least one client'); return; }

  setStatus('Saving route…', true);
  try {
    const res = await apiPost('saveRouteAssignment', {
      date: dateEl.value,
      slot: currentSlot,
      route: name,
      phones: picked.map(c => c.phone).join(',')
    });

    if (!res || !res.ok) { setStatus('Save failed: ' + ((res && res.message) || 'unknown'), false); return; }

    // written to the sheet AND folded into the data already loaded, so there is
    // no second fetch - build the next route straight away
    applyAssignmentLocally(currentSlot, name, picked.map(c => c.phone));

    checkedClients = {};
    stopAssignments = {};
    lastDistance = {};
    routeTotalMeters = null;

    currentClients = Object.values(slotGroups[currentSlot] || {}).flat();
    renderClientView(`${currentSlot} — New Route`);

    showToast(`Saved "${name}" · ${picked.length} client(s)`);
    setStatus(`"${name}" saved. Tick the next group, or go back to see the routes.`, false);
  } catch (err) {
    setStatus('Save failed: ' + err.message, false);
  }
}

function toggleAddPanel() {

function addClientToRoute(phone) {

function toggleStopMenu(btnEl, event) {
  if (event) event.stopPropagation();
  closeStopMenus();
  const wrapper = btnEl.parentElement;
  const phone = wrapper.dataset.phone;
  const total = currentClients.length;
  const currentVal = stopAssignments[phone] || '';
  const menu = document.createElement('div');
  menu.className = 'stop-dropdown-menu';
  const noneOpt = document.createElement('div');
  noneOpt.textContent = '-';
  noneOpt.onclick = () => selectStop(phone, '');
  menu.appendChild(noneOpt);
  for (let i = 1; i <= total; i++) {
    const taken = Object.entries(stopAssignments).some(([p, v]) => v === String(i) && p !== phone);
    if (taken) continue;
    const opt = document.createElement('div');
    opt.textContent = i;
    if (String(i) === currentVal) opt.style.fontWeight = '700';
    opt.onclick = () => selectStop(phone, String(i));
    menu.appendChild(opt);
  }
  menu.onclick = (e) => e.stopPropagation();
  wrapper.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeStopMenusOnce), 0);
}
function closeStopMenusOnce() { closeStopMenus(); document.removeEventListener('click', closeStopMenusOnce); }
function closeStopMenus() { document.querySelectorAll('.stop-dropdown-menu').forEach(m => m.remove()); }
function selectStop(phone, val) {
  if (val === '') { delete stopAssignments[phone]; }
  else { for (const p in stopAssignments) if (stopAssignments[p] === val && p !== phone) delete stopAssignments[p]; stopAssignments[phone] = val; checkedClients[phone] = true; }
  closeStopMenus();
  refreshStopOptions();
  maybeRenderMessage();
  computeRouteTotal().then(() => maybeRenderMessage());
}
function refreshStopOptions() {
  document.querySelectorAll('.stop-dropdown').forEach(wrapper => {
    const phone = wrapper.dataset.phone;
    const btn = wrapper.querySelector('.stop-dropdown-btn');
    if (btn) btn.textContent = stopAssignments[phone] || '-';
  });
}

/* ---- geo + distance ---- */
async function ensureGeo() {
  if (geoMap && Object.keys(geoMap).length) return geoMap;
  showToast('Loading client map locations…');
  try {
    const res = await apiPost('getClientGeo');
    const g = (res && res.ok && res.geo) ? res.geo : {};
    if (Object.keys(g).length) geoMap = g;
    return g;
  } catch (e) { return {}; }
}
function coordForClient(c, g) {
  // a one-day address wins for distance too
  if (c && c.ovLoc && c.ovLat != null && c.ovLng != null) return { lat: c.ovLat, lng: c.ovLng };
  if (!g) return null;
  if (c.location && c.location2 && c.location === c.location2) return g.loc2 || g.loc1;
  return g.loc1 || g.loc2;
}

async function autoOrderByDistance() {
  if (!window.google || !google.maps || !google.maps.DistanceMatrixService) { showToast('Maps still loading — try again in a moment'); return; }
  const geo = await ensureGeo();

  const pool = currentClients.filter(c => checkedClients[c.phone]);
  if (!pool.length) { showToast('Tick at least one client'); return; }

  const located = [], unlocated = [];
  pool.forEach(c => {
    const coord = coordForClient(c, geo[c.phone]);
    if (coord && coord.lat != null) located.push({ c, coord });
    else unlocated.push(c);
  });

  if (!located.length) { showToast('No saved map locations — number manually if needed'); routeTotalMeters = null; maybeRenderMessage(); return; }

  showToast('Building route…');
  lastMatrixError = null;
  const remaining = located.slice();
  const order = [];
  let current = KITCHEN;
  while (remaining.length) {
    const dists = await distancesFrom(current, remaining.map(x => x.coord));
    let best = -1, bestD = Infinity;
    for (let i = 0; i < dists.length; i++) { if (dists[i] < bestD) { bestD = dists[i]; best = i; } }
    if (best === -1) break;
    const chosen = remaining.splice(best, 1)[0];
    chosen.leg = bestD;
    order.push(chosen);
    current = chosen.coord;
  }
  remaining.forEach(x => unlocated.push(x.c));

  if (!order.length && located.length) {
    showToast('Distance service failed (' + (lastMatrixError || 'no response') + ') — check Google Maps API');
    return;
  }

  stopAssignments = {}; lastDistance = {};
  order.forEach((x, i) => { stopAssignments[x.c.phone] = String(i + 1); lastDistance[x.c.phone] = x.leg; });
  routeTotalMeters = order.reduce((s, x) => s + (isFinite(x.leg) ? x.leg : 0), 0);

  const orderedPhones = order.map(x => x.c.phone);
  const numberedClients = order.map(x => x.c);
  const restClients = currentClients.filter(c => orderedPhones.indexOf(c.phone) === -1);
  currentClients = numberedClients.concat(restClients);

  document.getElementById('clientListContainer').innerHTML = renderClientList(currentClients, true);
  refreshStopOptions();
  maybeRenderMessage();

  const raw = document.getElementById('messageOutput').dataset.raw || '';
  const copied = raw ? await copyText(raw) : false;
  const base = unlocated.length ? `Routed ${order.length} stops; ${unlocated.length} without location` : `Routed ${order.length} stops, nearest first`;
  showToast(base + (copied ? ' \u00b7 copied to clipboard' : ''));
}

function distancesFrom(origin, dests) {
  return new Promise(resolve => {
    const svc = new google.maps.DistanceMatrixService();
    const out = new Array(dests.length).fill(Infinity);
    let pending = 0, started = false;
    for (let i = 0; i < dests.length; i += 25) {
      const chunk = dests.slice(i, i + 25);
      pending++; started = true;
      svc.getDistanceMatrix({ origins: [origin], destinations: chunk, travelMode: google.maps.TravelMode.DRIVING }, (res, status) => {
        if (status === 'OK' && res.rows[0]) res.rows[0].elements.forEach((el, j) => { out[i + j] = (el.status === 'OK') ? el.distance.value : Infinity; });
        else { lastMatrixError = status; console.error('DistanceMatrix failed:', status, res); }
        if (--pending === 0) resolve(out);
      });
    }
    if (!started) resolve(out);
  });
}

async function computeRouteTotal() {
  if (!window.google || !google.maps || !google.maps.DistanceMatrixService) return;
  const geo = await ensureGeo();   // load map locations even if Auto-order was never used
  const numbered = currentClients
    .filter(c => stopAssignments[c.phone] && checkedClients[c.phone])
    .map(c => ({ stop: parseInt(stopAssignments[c.phone]), coord: coordForClient(c, geo[c.phone]) }))
    .filter(x => x.coord && x.coord.lat != null)
    .sort((a, b) => a.stop - b.stop);
  if (!numbered.length) { routeTotalMeters = null; return; }
  let total = 0, prev = KITCHEN;
  for (const x of numbered) {
    const d = await distancesFrom(prev, [x.coord]);
    if (isFinite(d[0])) total += d[0];
    prev = x.coord;
  }
  routeTotalMeters = total;
}

/* ---- slot overview: every client in the slot, grouped by route ---- */
function openOverview(slot) {

  if (!slotGroups[slot]) { showToast('Load a date first'); return; }

  const adhocNames = new Set(Object.values(routeAssign));
  const routes = Object.keys(slotGroups[slot]).sort((a, b) => {
    if (a === 'No Route') return 1; if (b === 'No Route') return -1;
    const aa = adhocNames.has(a) ? 1 : 0, bb = adhocNames.has(b) ? 1 : 0;
    if (aa !== bb) return aa - bb;
    return a.localeCompare(b, undefined, { numeric: true });
  });

  let total = 0;
  let rows = '';

  routes.forEach(route => {
    const list = slotGroups[slot][route].slice();

    // if this route was auto-ordered in this session, keep that order
    list.sort((a, b) => {
      const as = parseInt(stopAssignments[a.phone]), bs = parseInt(stopAssignments[b.phone]);
      const aH = !isNaN(as), bH = !isNaN(bs);
      if (aH && bH) return as - bs;
      if (aH) return -1;
      if (bH) return 1;
      return a.name.localeCompare(b.name);
    });

    list.forEach((c, i) => {
      total++;
      rows += `<tr${i === 0 ? ' class="rt-first"' : ''}>
        <td class="n">${i + 1}</td>
        <td class="nm">${escapeHtml(c.name)}${c.ovLoc ? ' *' : ''}</td>
        <td>${escapeHtml(c.location || '')}</td>
        <td>${escapeHtml(c.slot || '')}</td>
        <td class="rt">${escapeHtml(route)}</td>
      </tr>`;
    });
  });

  document.getElementById('ovTitle').textContent = `${slot} — full list`;
  document.getElementById('ovMeta').textContent =
    `${dateEl.value} · ${total} client(s) · ${routes.length} route(s)` +
    (Object.keys(routeAssign).length ? '  ·  * = address changed for this day' : '');

  document.getElementById('ovBody').innerHTML = `
    <table class="ovt">
      <thead><tr><th>#</th><th>Name</th><th>Location</th><th>Slot</th><th>Route</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5">No clients.</td></tr>'}</tbody>
    </table>`;

  document.getElementById('ovModal').classList.add('on');
}

function closeOverview() {
  document.getElementById('ovModal').classList.remove('on');
}

/* ---- one-day location override ---- */
let lmClient = null, lmAuto = null, lmPicked = null;

function findClient(phone, slot) {
  return allClients.find(c => c.phone === phone && c.slot === slot) || null;
}

function openLocModal(phone, slot) {
  const c = findClient(phone, slot);
  if (!c) return;

  lmClient = c;
  lmPicked = null;

  document.getElementById('lmName').textContent = c.name;
  document.getElementById('lmSub').textContent =
    `${slot} · this changes today\u2019s address only. Their saved address and their route stay as they are.`;
  document.getElementById('lmCur').innerHTML = c.ovLoc
    ? `Today: <b>${escapeHtml(c.ovLoc)}</b><br>Default: ${escapeHtml(c.baseLocation || '')}`
    : `Default: <b>${escapeHtml(c.baseLocation || c.location || '')}</b>`;
  document.getElementById('lmResetBtn').style.display = c.ovLoc ? '' : 'none';

  const inp = document.getElementById('lmInput');
  inp.value = '';
  document.getElementById('locModal').classList.add('on');
  setTimeout(() => inp.focus(), 60);

  // build the Google picker once the Maps script is ready
  if (window.google && google.maps && google.maps.places) {
    if (!lmAuto) {
      lmAuto = new google.maps.places.Autocomplete(inp, {
        fields: ['formatted_address', 'name', 'geometry'],
        componentRestrictions: { country: 'in' }
      });
      lmAuto.setBounds(new google.maps.LatLngBounds(
        new google.maps.LatLng(KITCHEN.lat - 0.35, KITCHEN.lng - 0.35),
        new google.maps.LatLng(KITCHEN.lat + 0.35, KITCHEN.lng + 0.35)));
      lmAuto.addListener('place_changed', () => {
        const pl = lmAuto.getPlace();
        if (!pl || !pl.geometry) { lmPicked = null; return; }
        const lat = pl.geometry.location.lat(), lng = pl.geometry.location.lng();
        const label = [pl.name, pl.formatted_address].filter(Boolean).join(', ');
        lmPicked = {
          location: label,
          lat: lat, lng: lng,
          link: 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng
        };
      });
    }
  } else {
    showToast('Maps still loading — try again in a moment');
  }
}

function closeLocModal() {
  document.getElementById('locModal').classList.remove('on');
  lmClient = null; lmPicked = null;
}

async function saveLocOverride() {
  if (!lmClient) return;

  const typed = (document.getElementById('lmInput').value || '').trim();
  if (!lmPicked && !typed) { showToast('Pick a location from the list'); return; }

  // typed but never chosen from the dropdown: keep the text, no coordinates
  const payload = lmPicked || { location: typed, lat: '', lng: '', link: '' };

  setStatus('Saving location…', true);
  try {
    const res = await apiPost('saveLocationOverride', {
      date: dateEl.value,
      slot: lmClient.slot,
      phone: lmClient.phone,
      location: payload.location,
      lat: payload.lat === '' ? '' : payload.lat,
      lng: payload.lng === '' ? '' : payload.lng,
      link: payload.link || ''
    });

    if (!res || !res.ok) { setStatus('Save failed: ' + ((res && res.message) || 'unknown'), false); return; }

    applyLocOverrideLocally(lmClient, payload);
    closeLocModal();
    showToast('Location changed for today');
    setStatus(`${lmClient ? '' : ''}Location updated. Re-run auto-order if you want the distances redone.`, false);
  } catch (err) {
    setStatus('Save failed: ' + err.message, false);
  }
}

async function resetLocOverride() {
  if (!lmClient) return;
  setStatus('Restoring default…', true);
  try {
    const res = await apiPost('saveLocationOverride', {
      date: dateEl.value, slot: lmClient.slot, phone: lmClient.phone,
      location: '', lat: '', lng: '', link: ''
    });
    if (!res || !res.ok) { setStatus('Failed: ' + ((res && res.message) || 'unknown'), false); return; }

    applyLocOverrideLocally(lmClient, null);
    closeLocModal();
    showToast('Back to their default address');
    setStatus('Default address restored.', false);
  } catch (err) {
    setStatus('Failed: ' + err.message, false);
  }
}

/* update in place - no refetch */
function applyLocOverrideLocally(c, payload) {
  if (payload) {
    c.ovLoc  = payload.location;
    c.ovLat  = (payload.lat === '' ? null : Number(payload.lat));
    c.ovLng  = (payload.lng === '' ? null : Number(payload.lng));
    c.ovLink = payload.link || '';
    c.location = payload.location;
  } else {
    c.ovLoc = ''; c.ovLat = null; c.ovLng = null; c.ovLink = '';
    c.location = c.baseLocation || c.location;
  }

  const cont = document.getElementById('clientListContainer');
  if (cont) cont.innerHTML = renderClientList(currentClients, true);
  refreshStopOptions();
  maybeRenderMessage();
}

/* ---- message ---- */
function linkForClient(c) {
  if (c && c.ovLoc && c.ovLink) return c.ovLink;
  const g = geoMap && geoMap[c.phone];
  if (!g) return '';
  if (c.location && c.location2 && c.location === c.location2) return g.loc2Link || g.loc1Link || '';
  return g.loc1Link || g.loc2Link || '';
}

function maybeRenderMessage() {
  const clients = currentClients.filter(c => checkedClients[c.phone]);
  const numbered = [], unnum = [];
  clients.forEach(c => {
    if (stopAssignments[c.phone]) numbered.push({ ...c, stop: parseInt(stopAssignments[c.phone]) });
    else unnum.push({ ...c, stop: null });
  });
  numbered.sort((a, b) => a.stop - b.stop);
  const ordered = numbered.concat(unnum);

  const out = document.getElementById('messageOutput');
  if (!out) return;
  if (!ordered.length) { out.innerHTML = ''; out.dataset.raw = ''; return; }

  let message = '';
  ordered.forEach(c => {
    const link = linkForClient(c);
    let block = (c.stop !== null ? (c.stop + '. ') : '') + c.name + '\n' + c.phone + '\n' + c.location;
    if (link) block += '\n' + link.replace(/,/g, '%2C');
    message += block + '\n\n';
  });
  message = message.trim();

  if (routeTotalMeters != null && routeTotalMeters > 0) {
    message += '\n\nTotal distance: ' + (routeTotalMeters / 1000).toFixed(1) + ' km ';
  }

  out.innerHTML = `<div class="message-box" id="msgText">${escapeHtml(message)}</div>
    <div class="action-row">
      <button class="btn" onclick="copyMessage()">📋 Copy</button>
      <button class="btn wa-btn" onclick="sendWhatsApp()">Share on WhatsApp</button>
    </div>`;
  out.dataset.raw = message;
}

function copyText(text) {
  if (!text) return Promise.resolve(false);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
function copyMessage() {
  const text = document.getElementById('messageOutput').dataset.raw || '';
  copyText(text).then(ok => showToast(ok ? 'Copied to clipboard!' : 'Copy failed — long-press to copy'));
}
function sendWhatsApp() {
  const text = document.getElementById('messageOutput').dataset.raw || '';
  if (!text) { showToast('Nothing to share yet'); return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeAttr(str) { return String(str).replace(/'/g, "\\'"); }
