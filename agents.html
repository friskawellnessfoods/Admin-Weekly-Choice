<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Friska — My Deliveries</title>
<script src="config.js"></script>
<style>
  :root{
    --c-bg:#eef2f6; --c-surface:#ffffff; --c-ink:#1f2a37; --c-muted:#5b6b7b; --c-line:#d7e0ea;
    --grad-a:#0ea5a3; --grad-b:#2563eb; --c-primary:#0ea5a3; --c-primary-d:#0b8482;
    --wa:#25D366; --ok:#0b8482; --bad:#dc2626;
    --radius:14px; --shadow:0 6px 24px rgba(20,40,70,.10);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    margin:0; background:var(--c-bg); color:var(--c-ink); -webkit-text-size-adjust:100%; }

  /* sign-in fills the screen until a number is entered */
  body.signin .work{ display:none; }
  body.working .gate{ display:none; }

  .gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; padding:28px 20px;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(37,99,235,.10), transparent 60%),
      radial-gradient(900px 500px at 50% 110%, rgba(14,165,163,.12), transparent 60%),
      var(--c-bg); }
  .gate img{ height:64px; }
  .gate h1{ margin:0; font-size:24px; font-weight:800;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .gate p{ margin:0; color:var(--c-muted); font-size:14px; text-align:center; }
  .gate .box{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px; }

  input, button{ font-family:inherit; }
  input[type=tel], input[type=date]{ width:100%; padding:14px 15px; font-size:17px;
    border:1.5px solid var(--c-line); border-radius:var(--radius);
    background:var(--c-surface); color:var(--c-ink); }
  input:focus{ outline:none; border-color:var(--c-primary); box-shadow:0 0 0 3px rgba(14,165,163,.16); }

  .btn{ padding:14px 18px; border:0; border-radius:var(--radius); font-size:16px; font-weight:700;
    cursor:pointer; color:#fff; background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    box-shadow:0 4px 14px rgba(37,99,235,.25); }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn.alt{ background:var(--c-surface); color:var(--c-primary-d);
    border:1.5px solid var(--c-line); box-shadow:none; }
  .btn.wa{ background:var(--wa); box-shadow:0 4px 14px rgba(37,211,102,.25); }
  .btn.sm{ padding:10px 14px; font-size:14px; border-radius:11px; box-shadow:none; }
  .btn:disabled{ opacity:.45; }

  .bar{ position:sticky; top:0; z-index:10; background:var(--c-surface);
    border-bottom:1px solid var(--c-line); padding:11px 14px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .who{ font-weight:800; font-size:15px; }
  .who small{ display:block; font-weight:500; font-size:11.5px; color:var(--c-muted); }
  .bar .sp{ flex:1; }

  .wrap{ max-width:620px; margin:0 auto; padding:14px 14px 90px; }

  .prog{ background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px 16px; margin-bottom:14px; }
  .prog .n{ font-size:26px; font-weight:800; }
  .prog .l{ font-size:12px; color:var(--c-muted); }
  .track{ height:8px; border-radius:99px; background:#e4ebf2; margin-top:10px; overflow:hidden; }
  .track i{ display:block; height:100%; background:var(--wa); transition:width .3s; }

  .slothead{ font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:var(--c-primary-d); margin:18px 0 8px; }

  .stop{ background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:13px 14px; margin-bottom:10px;
    display:flex; gap:12px; align-items:flex-start; }
  .stop.done{ opacity:.55; border-color:var(--wa); }
  .num{ flex:none; width:30px; height:30px; border-radius:50%; background:#eef2f6;
    color:var(--c-muted); font-weight:800; font-size:13px;
    display:flex; align-items:center; justify-content:center; }
  .stop.done .num{ background:var(--wa); color:#fff; }
  .mid{ flex:1; min-width:0; }
  .nm{ font-weight:700; font-size:15.5px; }
  .lo{ font-size:12.5px; color:var(--c-muted); margin-top:2px; word-break:break-word; }
  .tm{ font-size:11.5px; color:var(--ok); font-weight:700; margin-top:3px; }
  .acts{ display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
  .acts .btn{ flex:1; min-width:96px; }

  .status{ font-size:13px; color:var(--c-muted); min-height:18px; margin-bottom:10px; }
  .empty{ text-align:center; color:var(--c-muted); padding:46px 16px; font-size:14.5px;
    background:var(--c-surface); border-radius:var(--radius); box-shadow:var(--shadow); }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--c-ink); color:#fff; padding:12px 20px; border-radius:12px;
    font-size:14px; font-weight:600; opacity:0; transition:opacity .3s;
    pointer-events:none; z-index:100; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; }
</style>
</head>
<body class="signin">

<div class="gate">
  <img src="logo.png" alt="Friska">
  <h1>My Deliveries</h1>
  <p>Enter the phone number your routes are saved under.</p>
  <div class="box">
    <input type="tel" id="phone" inputmode="numeric" placeholder="your phone number" autocomplete="tel">
    <button class="btn" id="go">Show my stops</button>
    <div class="status" id="gateMsg" style="text-align:center"></div>
  </div>
</div>

<div class="work">
  <div class="bar">
    <div class="who" id="who">—<small id="whoSub"></small></div>
    <span class="sp"></span>
    <input type="date" id="date" style="width:auto;padding:9px 11px;font-size:14px">
    <button class="btn alt sm" id="refresh">Refresh</button>
    <button class="btn alt sm" id="signout">Sign out</button>
  </div>

  <div class="wrap">
    <div class="status" id="status"></div>
    <div id="prog"></div>
    <div id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = (typeof API_URL !== 'undefined' && API_URL) ? API_URL : '';
const $ = id => document.getElementById(id);

let DAY = null, myPhone = '';

const today = () => { const n = new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); };
$('date').value = today();

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                   .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200); }

async function api(action, params={}){
  if (!API) throw new Error('config.js did not load');
  const res = await fetch(API, { method:'POST', body:new URLSearchParams({ action, ...params }) });
  return res.json();
}

/* the rider's own number is remembered on their phone so they sign in once */
try { myPhone = localStorage.getItem('friska_agent_phone') || ''; } catch(e){}
if (myPhone){ $('phone').value = myPhone; load(); }

$('go').addEventListener('click', ()=>{
  const p = ($('phone').value||'').replace(/\D/g,'');
  if (p.length < 10){ $('gateMsg').textContent = 'Enter all 10 digits.'; return; }
  myPhone = p.slice(-10);
  try { localStorage.setItem('friska_agent_phone', myPhone); } catch(e){}
  load();
});
$('phone').addEventListener('keydown', e=>{ if (e.key==='Enter') $('go').click(); });

$('refresh').addEventListener('click', load);
$('date').addEventListener('change', load);
$('signout').addEventListener('click', ()=>{
  try { localStorage.removeItem('friska_agent_phone'); } catch(e){}
  myPhone=''; DAY=null; document.body.className='signin'; $('gateMsg').textContent='';
});

async function load(){
  $('gateMsg').textContent = 'Loading…';
  $('status').textContent = 'Loading…';
  try {
    const r = await api('getAgentDay', { phone: myPhone, date: $('date').value });
    if (!r || !r.ok) throw new Error((r && r.message) || 'Could not load');
    if (!r.found){
      $('gateMsg').textContent = r.message || 'No routes found for that number.';
      document.body.className = 'signin';
      return;
    }
    DAY = r;
    document.body.className = 'working';
    $('who').innerHTML = esc(r.name || 'Rider') +
      '<small>' + (r.routes||[]).map(esc).join(', ') + '</small>';
    render();
  } catch(e){
    $('gateMsg').textContent = 'Error: ' + e.message;
    $('status').textContent  = 'Error: ' + e.message;
  }
}

function render(){
  const stops = (DAY && DAY.stops) || [];
  if (!stops.length){
    $('prog').innerHTML = '';
    $('list').innerHTML = '<div class="empty">Nothing assigned to you for this date.</div>';
    $('status').textContent = '';
    return;
  }

  const done = stops.filter(s=>s.delivered).length;
  const pct  = Math.round(done/stops.length*100);
  $('prog').innerHTML =
    '<div class="prog"><div class="n">'+done+' / '+stops.length+'</div>'+
    '<div class="l">delivered</div><div class="track"><i style="width:'+pct+'%"></i></div></div>';

  let lastSlot = null;
  $('list').innerHTML = stops.map((s,i)=>{
    let head = '';
    if (s.slot !== lastSlot){
      head = '<div class="slothead">'+esc(s.meal||s.slot)+'</div>';
      lastSlot = s.slot;
    }
    return head +
      '<div class="stop'+(s.delivered?' done':'')+'">'+
        '<div class="num">'+(s.delivered?'&#10003;':s.stop)+'</div>'+
        '<div class="mid">'+
          '<div class="nm">'+esc(s.name)+'</div>'+
          '<div class="lo">'+esc(s.location||'')+'</div>'+
          (s.delivered && s.at ? '<div class="tm">delivered '+esc(String(s.at).slice(11,16))+'</div>' : '')+
          '<div class="acts">'+
            (s.link ? '<button class="btn alt sm" onclick="openMap('+i+')">Map</button>' : '')+
            '<button class="btn alt sm" onclick="callClient('+i+')">Call</button>'+
            (s.delivered
              ? '<button class="btn alt sm" onclick="undo('+i+')">Undo</button>'
              : '<button class="btn wa sm" onclick="deliver('+i+')">Delivered</button>')+
          '</div>'+
        '</div>'+
      '</div>';
  }).join('');

  $('status').textContent = done === stops.length
    ? 'All done for ' + DAY.date + '.'
    : (stops.length - done) + ' left on ' + DAY.date + '.';
}

function openMap(i){
  const s = DAY.stops[i];
  if (s.link) window.open(s.link.replace(/,/g,'%2C'), '_blank');
}
function callClient(i){ window.location.href = 'tel:' + DAY.stops[i].phone; }

/* Mark it the moment he taps, then hand off to WhatsApp. The write finishes
   first so a tap that navigates away is still recorded. */
async function deliver(i){
  const s = DAY.stops[i];
  s.delivered = true; s.at = ''; render();        // instant feedback

  try {
    const r = await api('markDelivered', {
      date: DAY.date, slot: s.slot, route: s.route,
      phone: s.phone, by: DAY.name || myPhone
    });
    if (r && r.ok){ s.at = r.at || ''; render(); }
    else { s.delivered = false; render(); toast('Could not save that'); return; }
  } catch(e){
    s.delivered = false; render(); toast('Could not save: ' + e.message); return;
  }

  const msg  = 'Hi ' + s.name + ', your delivery by Friska Wellness is done.';
  const num  = s.phone.length === 10 ? '91' + s.phone : s.phone;
  window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(msg), '_blank');
}

async function undo(i){
  const s = DAY.stops[i];
  if (!confirm('Mark ' + s.name + ' as not delivered?')) return;
  s.delivered = false; s.at = ''; render();
  try {
    const r = await api('undoDelivered', { date: DAY.date, slot: s.slot, phone: s.phone });
    if (!r || !r.ok){ s.delivered = true; render(); toast('Could not undo'); }
  } catch(e){ s.delivered = true; render(); toast('Could not undo: ' + e.message); }
}
</script>
</body>
</html>
