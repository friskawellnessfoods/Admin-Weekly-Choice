<!DOCTYPE html>
<html>

<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Menu</title>

<!-- All endpoint settings come from config.js -->
<script src="config.js"></script>

<style>

body{
font-family:"Georgia",serif;
margin:0;
padding:20px;
color:#111;

background:linear-gradient(
180deg,
#f7e27a 0%,
#f2d35a 40%,
#e6b93f 100%
);
}
.spinner{
width:16px;
height:16px;
border:2px solid rgba(255,255,255,0.4);
border-top:2px solid white;
border-radius:50%;
display:inline-block;
margin-left:8px;
animation:spin 0.8s linear infinite;
}

@keyframes spin{
0%{ transform:rotate(0deg); }
100%{ transform:rotate(360deg); }
}
.menu-wrapper{
max-width:1200px;
margin:auto;
}

.menu-header{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin-bottom:25px;
}

.logo{
height:55px;
}

.menu-title{
font-size:44px;
letter-spacing:6px;
margin:0;
}

/* TABS */

.tabs{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:18px;
}

.tab{
padding:8px 18px;
border:1px solid #bbb;
background:white;
cursor:pointer;
font-weight:bold;
letter-spacing:1px;
}

.tab.active{
background:black;
color:white;
}

/* DATE RANGE */

.date-range{
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:35px;
font-weight:bold;
letter-spacing:1px;
font-size:14px;
}

.date-range input{
font-family:inherit;
font-size:14px;
padding:6px 10px;
border:1px solid #bbb;
background:white;
}

.date-range .quick{
padding:6px 12px;
border:1px solid #bbb;
background:white;
cursor:pointer;
font-family:inherit;
font-weight:bold;
font-size:12px;
letter-spacing:1px;
}

/* DOWNLOAD BUTTON */

.download-btn{
background:#0a1a6e;
color:white;
border:none;
padding:8px 18px;
font-weight:bold;
letter-spacing:1px;
cursor:pointer;
}

/* GRID */

.menu-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:30px;
}

/* DAY CARD */

.day-card{
background:
linear-gradient(rgba(255,255,255,0.85),rgba(255,255,255,0.85)),
url("bg.webp");
background-size:cover;
background-position:center;
padding:28px;
border:2px solid #000;
border-radius:4px;
box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.day-card h2{
text-align:center;
letter-spacing:4px;
font-size:26px;
margin-bottom:4px;
}

.day-date{
text-align:center;
font-size:14px;
letter-spacing:2px;
margin-bottom:22px;
opacity:0.75;
}

/* SECTION */

.section{
margin-bottom:24px;
}

.label{
text-align:center;
font-weight:bold;
letter-spacing:2px;
text-decoration:underline;
font-size:14px;
margin-bottom:10px;
}

/* DISH */

.dish{
font-size:15px;
line-height:1.7;
margin-bottom:6px;
color:#000;
}

/* DIVIDER */

.divider{
height:1px;
background:#d6b85c;
margin:18px 0;
}

/* MESSAGE / ERROR STATE */

.menu-msg{
grid-column:1 / -1;
text-align:center;
padding:40px 20px;
font-size:18px;
line-height:1.6;
}

.menu-msg button{
margin-top:14px;
background:#0a1a6e;
color:white;
border:none;
padding:8px 18px;
font-weight:bold;
letter-spacing:1px;
cursor:pointer;
font-family:inherit;
}

/* MOBILE */

@media(max-width:900px){

.menu-grid{
grid-template-columns:1fr;
}

.menu-title{
font-size:34px;
}

}

</style>
</head>

<body>

<div class="menu-wrapper">

<div class="menu-header">
<img src="logo.png" class="logo">
<h1 class="menu-title">WEEKLY MENU</h1>
</div>

<div class="tabs">

<div class="tab active" onclick="switchProtein('all',this)">ALL</div>
<div class="tab" onclick="switchProtein('veg',this)">VEGETARIAN</div>
<div class="tab" onclick="switchProtein('chicken',this)">CHICKEN</div>
<div class="tab" onclick="switchProtein('egg',this)">EGG</div>
<div class="tab" onclick="switchProtein('seafood',this)">SEAFOOD</div>

<button id="downloadBtn" class="download-btn" onclick="downloadMenuPDF()">
<span id="downloadText">DOWNLOAD MENU</span>
<span id="downloadSpinner" class="spinner" style="display:none;"></span>
</button>

</div>

<div class="date-range">
<label>FROM <input type="date" id="fromDate"></label>
<label>TO <input type="date" id="toDate"></label>
<button class="quick" onclick="quickRange('week')">THIS WEEK</button>
<button class="quick" onclick="quickRange('next')">NEXT WEEK</button>
<button class="quick" onclick="quickRange('month')">THIS MONTH</button>
</div>

<div id="menuGrid" class="menu-grid">
<div class="menu-msg">Loading menu...</div>
</div>

</div>

<script>

/* ================= CONFIG =================
   config.js must define:   API_URL
   Uses backend action getMenuByDate (start, end) -> reads yearly Menu sheet.
=========================================== */

function cfgVal(name, fallback){
try {
const v = eval("typeof " + name + " !== 'undefined' ? " + name + " : undefined");
return (v === undefined || v === null || v === "") ? fallback : v;
} catch(e){
return fallback;
}
}

const MENU_ENDPOINT = cfgVal("API_URL", "");
const MENU_RANGE_ACTION = "getMenuByDate";
const MENU_WEEK_ACTION  = cfgVal("MENU_ACTION", "getGlideMenu");

/* ================= DATE LIMITS =================
   Min = 1st of current month, Max = last day of next month.
   Rolls automatically every month.
=============================================== */

function ymd(d){
return d.getFullYear() + "-" +
String(d.getMonth()+1).padStart(2,"0") + "-" +
String(d.getDate()).padStart(2,"0");
}

function parseYmd(s){
const [y,m,d] = String(s).split("-").map(Number);
return new Date(y, m-1, d);
}

function addDays(d, n){
const x = new Date(d); x.setDate(x.getDate()+n); return x;
}

const TODAY     = new Date(); TODAY.setHours(0,0,0,0);
const RANGE_MIN = ymd(new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
const RANGE_MAX = ymd(new Date(TODAY.getFullYear(), TODAY.getMonth()+2, 0));

function clampYmd(s){
if(!s) return s;
if(s < RANGE_MIN) return RANGE_MIN;
if(s > RANGE_MAX) return RANGE_MAX;
return s;
}

/* Monday of the week containing d */
function weekStart(d){
const x = new Date(d);
const dow = (x.getDay() + 6) % 7;
return addDays(x, -dow);
}

const fromInput = document.getElementById("fromDate");
const toInput   = document.getElementById("toDate");

[fromInput, toInput].forEach(inp=>{
inp.min = RANGE_MIN;
inp.max = RANGE_MAX;
});

function setRange(from, to){
from = clampYmd(from);
to   = clampYmd(to);
if(from > to){ const t = from; from = to; to = t; }
fromInput.value = from;
toInput.value   = to;
loadMenu();
}

function quickRange(kind){
let s, e;
if(kind === "week"){
s = weekStart(TODAY); e = addDays(s, 6);
} else if(kind === "next"){
s = addDays(weekStart(TODAY), 7); e = addDays(s, 6);
} else {
s = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
e = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 0);
}
setRange(ymd(s), ymd(e));
}

/* load only when BOTH dates are filled */
function onDateChange(){
if(fromInput.value && toInput.value) setRange(fromInput.value, toInput.value);
}
fromInput.addEventListener("change", onDateChange);
toInput.addEventListener("change",   onDateChange);

/* ================= DATA ================= */

let weeklyMenu = {};
let activeProtein = "all";

function showMsg(html){
document.getElementById("menuGrid").innerHTML =
`<div class="menu-msg">${html}</div>`;
}

/* getMenuByDate returns "(Chicken) dish" + plain snack labels.
   Normalise to "Chicken: dish" / "Snack: dish" to match the old look. */
function normaliseMenu(data){
const fixList = arr => (arr || []).map(x=>{
if(!x || typeof x !== "object") return x;
const m = String(x.label || "").match(/^\((.+?)\)\s*(.*)$/);
return m ? Object.assign({}, x, { label: m[1] + ": " + m[2] }) : x;
});
const out = {};
Object.keys(data).forEach(k=>{
const d = data[k] || {};
out[k] = {
breakfast: fixList(d.breakfast),
option1:   fixList(d.option1),
option2:   fixList(d.option2),
snack: (d.snack || []).map(s=>
(s && typeof s === "object")
? { label: (s.type ? s.type + ": " : "") + s.label, type: s.type }
: s),
juice1: d.juice1 || [],
juice2: d.juice2 || []
};
});
return out;
}

async function loadMenu(){

if(!MENU_ENDPOINT){
showMsg(`Configuration missing.
<br><span style="font-size:14px;opacity:0.75;">config.js did not load, or it does not define API_URL.</span>
<br><button onclick="loadMenu()">RETRY</button>`);
return;
}

const from = fromInput.value, to = toInput.value;
/* no dates -> running week (getGlideMenu); both dates -> range (getMenuByDate) */
const runningWeek = !(from && to);

showMsg("Loading menu...");

try {

const sep = MENU_ENDPOINT.indexOf("?") >= 0 ? "&" : "?";
const url = runningWeek
? MENU_ENDPOINT + sep + "action=" + encodeURIComponent(MENU_WEEK_ACTION) + "&t=" + Date.now()
: MENU_ENDPOINT + sep
+ "action=" + encodeURIComponent(MENU_RANGE_ACTION)
+ "&start=" + encodeURIComponent(from)
+ "&end="   + encodeURIComponent(to)
+ "&t=" + Date.now();

const res = await fetch(url, { cache: "no-store" });
if(!res.ok) throw new Error("HTTP " + res.status);

const text = await res.text();

let data;
try {
data = JSON.parse(text);
} catch(parseErr){
throw new Error("The menu service did not return valid data. Check the deployment URL and its access setting.");
}

if(data && data.error) throw new Error(String(data.error));
if(!data || typeof data !== "object" || Array.isArray(data))
throw new Error("Unexpected menu format.");

if(runningWeek){
if(!Object.keys(data).length){
weeklyMenu = {};
showMsg(`No menu has been published for this week yet.
<br><button onclick="loadMenu()">RETRY</button>`);
return;
}
weeklyMenu = data;   /* getGlideMenu already uses "Chicken: dish" labels */
renderMenu();
return;
}

/* safety: keep only dates inside the selected + allowed range */
const filtered = {};
Object.keys(data).forEach(k=>{
if(k >= from && k <= to && k >= RANGE_MIN && k <= RANGE_MAX) filtered[k] = data[k];
});

if(!Object.keys(filtered).length){
weeklyMenu = {};
showMsg(`No menu published for the selected dates.
<br><button onclick="loadMenu()">RETRY</button>`);
return;
}

weeklyMenu = normaliseMenu(filtered);
renderMenu();

} catch(err){

console.error("loadMenu failed:", err);
showMsg(`Could not load the menu.
<br><span style="font-size:14px;opacity:0.75;">${String(err.message || err)}</span>
<br><button onclick="loadMenu()">RETRY</button>`);

}

}

function switchProtein(type,el){
activeProtein = type;
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");
if(Object.keys(weeklyMenu).length) renderMenu();
}

/* ================= RENDER ================= */

function renderMenu(dateList){

const grid = document.getElementById("menuGrid");
grid.innerHTML="";

const dates = dateList || Object.keys(weeklyMenu).sort();

dates.forEach(date=>{

const d = weeklyMenu[date];
const dt = parseYmd(date);

const dayName = dt.toLocaleDateString('en-US',{weekday:'long'});
const dateLabel = dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

function filterProtein(arr){
if(!arr) return "";
return arr
.filter(x=>{
if(activeProtein==="all") return true;
const p=(x.protein||"").toLowerCase();
return p===activeProtein;
})
.map(x=>`<div class="dish">${x.label}</div>`)
.join("");
}

/* Breakfast: ALL / VEG (Veg Breakfast) / CHICKEN (Breakfast); none for egg/seafood */
function filterBreakfast(arr){
if(!arr) return "";
if(activeProtein==="egg" || activeProtein==="seafood") return "";
return arr
.filter(x=>{
if(activeProtein==="all") return true;
const p=(x.protein||"").toLowerCase();
if(activeProtein==="veg")     return p==="veg breakfast";
if(activeProtein==="chicken") return p==="breakfast";
return false;
})
.map(x=>`<div class="dish">${x.label}</div>`)
.join("");
}

function simpleList(arr){
if(!arr) return "";
return arr
.map(x=>`<div class="dish">${x.label||x}</div>`)
.join("");
}

const breakfastHTML = filterBreakfast(d.breakfast);

const card = `
<div class="day-card">

<h2>${dayName.toUpperCase()}</h2>
<div class="day-date">${dateLabel.toUpperCase()}</div>

${breakfastHTML ? `
<div class="section">
<div class="label">BREAKFAST</div>
${breakfastHTML}
</div>
<div class="divider"></div>
` : ``}

<div class="section">
<div class="label">OPTION 1</div>
${filterProtein(d.option1)}
</div>

<div class="divider"></div>

<div class="section">
<div class="label">OPTION 2</div>
${filterProtein(d.option2)}
</div>

<div class="divider"></div>

<div class="section">
<div class="label">SNACK</div>
${simpleList(d.snack)}
</div>

<div class="divider"></div>

<div class="section">
<div class="label">JUICES</div>
${simpleList(d.juice1)}
${simpleList(d.juice2)}
</div>

</div>
`;

grid.innerHTML += card;

});

}

/* ================= PDF DOWNLOAD =================
   6 days per A4 page (2 rows x 3) so long ranges stay readable.
================================================ */

const DAYS_PER_PAGE = 6;

function shortDate(s){
return parseYmd(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

async function downloadMenuPDF(){

if(!Object.keys(weeklyMenu).length){
alert("Menu has not loaded yet.");
return;
}

const btn = document.getElementById("downloadBtn");
const text = document.getElementById("downloadText");
const spinner = document.getElementById("downloadSpinner");

text.innerText = "Preparing PDF";
spinner.style.display = "inline-block";
btn.disabled = true;

const { jsPDF } = window.jspdf;
const pdf = new jsPDF("p","mm","a4");

const grid = document.querySelector(".menu-grid");
grid.style.gridTemplateColumns = "repeat(3,1fr)";
grid.style.width = "1200px";

const prevProtein = activeProtein;

const categories = (prevProtein === "all")
? [ {key:"all",label:"WEEKLY"} ]
: [
{key:"veg",label:"VEGETARIAN"},
{key:"chicken",label:"CHICKEN"},
{key:"egg",label:"EGG"},
{key:"seafood",label:"SEAFOOD"}
];

const allDates = Object.keys(weeklyMenu).sort();
const chunks = [];
for(let i=0;i<allDates.length;i+=DAYS_PER_PAGE) chunks.push(allDates.slice(i,i+DAYS_PER_PAGE));

try {

let page = 0;

for(const cat of categories){

activeProtein = cat.key;

for(const chunk of chunks){

renderMenu(chunk);
await new Promise(r=>setTimeout(r,400));

const canvas = await html2canvas(grid,{ scale:2, useCORS:true });
const imgData = canvas.toDataURL("image/png");

const maxW = 200, maxH = 297 - 26 - 5;
let w = maxW;
let h = canvas.height * w / canvas.width;
if(h > maxH){ h = maxH; w = canvas.width * h / canvas.height; }
const x = (210 - w) / 2;

if(page>0) pdf.addPage();
page++;

pdf.setFontSize(22);
pdf.text(cat.label + " MENU",105,14,{align:"center"});
pdf.setFontSize(11);
pdf.text(shortDate(chunk[0]) + "  -  " + shortDate(chunk[chunk.length-1]),105,21,{align:"center"});

pdf.addImage(imgData,"PNG",x,26,w,h);

}

}

pdf.save("Menu_" + allDates[0] + "_to_" + allDates[allDates.length-1] + ".pdf");

} catch(err){

console.error("PDF failed:", err);
alert("Could not build the PDF. Please try again.");

} finally {

grid.style.gridTemplateColumns = "";
grid.style.width = "";

activeProtein = prevProtein;
renderMenu();

text.innerText = "DOWNLOAD MENU";
spinner.style.display = "none";
btn.disabled = false;

}

}

/* ================= INIT: running week, date boxes empty ================= */
loadMenu();

</script>

</body>
</html>
